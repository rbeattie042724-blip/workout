function commitRoll(start){
  if(!ROLL) return;
  const rec = {
    id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),
    style:ROLL.style, name:ROLL.name, focus:ROLL.focus, gear:ROLL.gear,
    mins:ROLL.mins, blurb:ROLL.focus, rolled:true,
    ex:ROLL.ex.map(x=>({nm:x.nm, sets:x.sets, reps:x.reps, rest:x.rest, cue:x.cue||''}))
  };
  S.custom = S.custom || [];
  S.custom.push(rec);
  const name = rec.name;
  ROLL = null; saveNow();
  if(start){ startWorkout(rec.id, todayIso()); return; }
  closeSheet(); render(); toast(`${name} saved to your workouts`);
}

/* ══════════════════════════════════════ runner ══════════════════════════ */
let restInt=null, clockInt=null;

function startWorkout(optId, date){
  const o = getOpt(optId); if(!o) return;
  if(S.draft && S.draft.workoutId !== optId){
    if(!confirm('You have an unfinished session in progress. Starting a new one will discard it.')) return;
  }
  if(!S.draft || S.draft.workoutId !== optId || S.draft.date !== date){
    S.draft = {
      workoutId:optId, date, startedAt:Date.now(), elapsed:0, notes:'',
      entries:Object.fromEntries(o.ex.map(x=>[x.nm, Array.from({length:x.sets},()=>({w:'',r:'',done:false}))]))
    };
    save();
  } else {
    S.draft.startedAt = Date.now() - (S.draft.elapsed||0)*1000;
  }
  closeSheet();
  renderRunner();
}
function resumeDraft(){ if(S.draft){ S.draft.startedAt = Date.now() - (S.draft.elapsed||0)*1000; renderRunner(); } }

function lastPerf(nm){
  const s = [...S.sessions].sort((a,b)=>a.date<b.date?1:-1).find(x=>x.entries && x.entries[nm] && x.entries[nm].some(v=>v.done));
  if(!s) return '';
  const done = s.entries[nm].filter(v=>v.done);
  const top = done.reduce((a,b)=> (+b.w||0)>(+a.w||0)?b:a, done[0]);
  return top && +top.w>0 ? `last ${top.w}×${top.r}` : '';
}

function renderRunner(){
  const d = S.draft; if(!d) return;
  const o = getOpt(d.workoutId);
  const el = document.createElement('div');
  el.className='runner'; el.id='runner';
  el.innerHTML = `
    <div class="run-top"><div class="run-top-in">
      <button class="icon-btn" id="runMin" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg></button>
      <div class="t"><b>${esc(o.name)}</b><i>${o.day.id==='custom'?'CUSTOM':'DAY '+o.day.n} · ${styleName(o.style).toUpperCase()}</i></div>
      <span class="clock" id="clock">0:00</span>
      <button class="icon-btn" id="runDone" aria-label="Finish" style="border-color:var(--good);color:var(--good)">${svgCheck()}</button>
    </div></div>
    <div class="wrap" style="padding-top:14px">
      <div id="exWrap">${o.ex.map((x,i)=>runEx(x,i,d)).join('')}</div>
      <label class="fld" style="margin-top:6px"><span class="lb">Session notes</span>
        <textarea id="runNotes" placeholder="How it felt, what to change next time">${esc(d.notes||'')}</textarea></label>
    </div>
    <div class="run-foot">
      <button class="btn" id="finishBtn">Finish &amp; log session</button>
      <button class="btn danger" id="discardBtn" style="margin-top:10px">Discard — don't log this</button>
    </div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  tickClock();
  clearInterval(clockInt); clockInt = setInterval(tickClock, 1000);
}
function runEx(x,i,d){
  const sets = d.entries[x.nm] || [];
  const all = sets.length && sets.every(s=>s.done);
  const lp = lastPerf(x.nm);
  return `<div class="run-ex ${all?'complete':''}" data-ex="${esc(x.nm)}">
    <h4>${pad(i+1)}. ${esc(x.nm)}</h4>
    <div class="sub"><span>${x.sets} × ${esc(x.reps)}</span><span>rest ${esc(x.rest)}</span>${lp?`<span>${lp}</span>`:''}</div>
    <div class="cue">${esc(x.cue)}</div>
    <div class="sets">${sets.map((s,j)=>`
      <div class="setrow ${s.done?'on':''}" data-set="${j}">
        <span class="sn">${j+1}</span>
        <input type="number" inputmode="decimal" placeholder="${S.units}" value="${esc(s.w)}" data-f="w" aria-label="Weight set ${j+1}">
        <input type="number" inputmode="numeric" placeholder="${(String(x.reps).match(/\d+/)||['reps'])[0]}" value="${esc(s.r)}" data-f="r" aria-label="Reps set ${j+1}">
        <button class="tick" data-tick="${j}" aria-pressed="${s.done}" aria-label="Complete set ${j+1}" data-rest="${esc(x.rest)}">${svgCheck()}</button>
      </div>`).join('')}</div>
    <button class="addset" data-add="${esc(x.nm)}">+ add set</button>
  </div>`;
}
function tickClock(){
  if(!S.draft) return;
  S.draft.elapsed = Math.floor((Date.now()-S.draft.startedAt)/1000);
  const c = $('#clock'); if(!c) return;
  const s = S.draft.elapsed, h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  c.textContent = (h?h+':'+pad(m):m) + ':' + pad(s%60);
  if(s%10===0) save();
}
function closeRunner(){
  clearInterval(clockInt); clearInterval(restInt);
  const r = $('#runner'); if(r) r.remove();
  const rt = $('#rest'); if(rt) rt.remove();
  document.body.style.overflow='';
}
function startRest(str){
  const parts = String(str).split(':').map(Number);
  let secs = parts.length===2 ? parts[0]*60+parts[1] : parts[0]||60;
  if(!secs || isNaN(secs)) return;
  clearInterval(restInt);
  let el = $('#rest');
  if(!el){ el=document.createElement('div'); el.className='resttimer'; el.id='rest'; document.body.appendChild(el); }
  const paint = ()=>{ el.innerHTML = `<span>Rest ${Math.floor(secs/60)}:${pad(secs%60)}</span><button id="skipRest">skip</button>`; };
  paint();
  restInt = setInterval(()=>{
    secs--;
    if(secs<=0){ clearInterval(restInt); el.innerHTML='<span>Rest done — next set</span>'; setTimeout(()=>el.remove(),2600);
      if(navigator.vibrate) navigator.vibrate([90,60,90]); return; }
    paint();
  },1000);
}
function finishWorkout(){
  const d = S.draft; if(!d) return;
  const o = getOpt(d.workoutId);
  const setCount = Object.values(d.entries).reduce((a,arr)=>a+arr.filter(s=>s.done).length,0);
  if(!setCount && !confirm('No sets are marked complete. Log this session anyway?')) return;
  const sess = {
    id:'s'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    date:d.date, workoutId:d.workoutId, name:o.name, notes:d.notes||'',
    durationMin:Math.max(1, Math.round((d.elapsed||0)/60)),
    entries:d.entries, setCount, volume:0
  };
  sess.volume = volumeOf(sess);
  S.sessions = S.sessions.filter(s=>s.date!==sess.date || s.workoutId!==sess.workoutId);
  S.sessions.push(sess);
  if(!S.scheduled[d.date]) S.scheduled[d.date] = {workoutId:d.workoutId, time:'', note:''};
  S.draft = null;
  saveNow();
  closeRunner(); render();
  toast(`Logged ${o.name} · ${sess.setCount} sets · ${fmtVol(sess.volume)} ${S.units}`);
}

/* ══════════════════════════════════════ events ══════════════════════════ */
document.addEventListener('click', e=>{
  const t = e.target;

  const close = t.closest('[data-close]'); if(close){ closeSheet(); return; }
  const day = t.closest('[data-day]'); if(day){ openDay(day.dataset.day); return; }
  const open = t.closest('[data-open]'); if(open){ openWorkout(open.dataset.open); return; }
  const hist = t.closest('[data-hist]'); if(hist){ openHistory(hist.dataset.hist); return; }
  const mv = t.closest('[data-mv]'); if(mv){ openMovement(mv.dataset.mv); return; }
  const bld = t.closest('[data-build]'); if(bld){ openBuilder(bld.dataset.build); return; }
  if(t.closest('[data-roll]')){ ROLL = null; openRoller(); return; }
  const rd = t.closest('[data-rday]');   if(rd){ ROLLQ.day = rd.dataset.rday; ROLL = null; openRoller(); return; }
  const rs = t.closest('[data-rstyle]'); if(rs){ ROLLQ.style = rs.dataset.rstyle; ROLL = null; openRoller(); return; }
  if(t.closest('[data-rgo]')){ ROLL = rollWorkout(ROLLQ.day, ROLLQ.style); openRoller(); return; }
  if(t.closest('[data-rsave]')){ commitRoll(false); return; }
  if(t.closest('[data-rstart]')){ commitRoll(true); return; }

  const go = t.closest('[data-goto]');
  if(go){ closeSheet(); $(`#nav button[data-tab="${go.dataset.goto}"]`).click(); return; }

  const mo = t.closest('[data-mo]');
  if(mo){ const v=+mo.dataset.mo;
    if(v===0){ calCursor=new Date(); calCursor.setDate(1); } else calCursor.setMonth(calCursor.getMonth()+v);
    render(); return; }

  const pick = t.closest('[data-pick]');
  if(pick){
    pickSel = pickSel===pick.dataset.pick ? null : pick.dataset.pick;
    [...document.querySelectorAll('[data-pick]')].forEach(p=>p.setAttribute('aria-pressed', String(p.dataset.pick===pickSel)));
    return;
  }

  const sched = t.closest('[data-schedule]');
  if(sched){
    const date = sched.dataset.schedule;
    if(!pickSel){ toast('Pick a session first.'); return; }
    S.scheduled[date] = { workoutId:pickSel, time:$('#fTime').value||'', note:$('#fNote').value.trim() };
    saveNow(); closeSheet(); render();
    toast(`${getOpt(pickSel).name} · ${relDay(date)}`);
    return;
  }
  const unsch = t.closest('[data-unschedule]');
  if(unsch){
    const d = unsch.dataset.unschedule;
    const o = S.scheduled[d] && getOpt(S.scheduled[d].workoutId);
    if(!$('#layer').innerHTML && !confirm(`Remove ${o?o.name:'this session'} from ${relDay(d)}?`)) return;
    delete S.scheduled[d]; saveNow(); closeSheet(); render(); toast('Removed from calendar');
    return;
  }

  const sp = t.closest('[data-schedpick]');
  if(sp){ const id=sp.dataset.schedpick; closeSheet(); setTimeout(()=>{ openDay(todayIso()); pickSel=id;
      [...document.querySelectorAll('[data-pick]')].forEach(p=>p.setAttribute('aria-pressed', String(p.dataset.pick===pickSel))); },10); return; }

  const st = t.closest('[data-start]');
  if(st){ startWorkout(st.dataset.start, st.dataset.date || todayIso()); return; }

  const del = t.closest('[data-delsess]');
  if(del){
    if(!confirm('Delete this logged session? This cannot be undone.')) return;
    S.sessions = S.sessions.filter(s=>s.id!==del.dataset.delsess);
    remember_deleted(del.dataset.delsess);
    saveNow(); closeSheet(); render(); toast('Session deleted');
    return;
  }

  const bs = t.closest('[data-bstyle]');
  if(bs && EDIT){
    EDIT.style = bs.dataset.bstyle;
    [...document.querySelectorAll('[data-bstyle]')].forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.bstyle===EDIT.style)));
    return;
  }
  if(t.closest('[data-badd]') && EDIT){ EDIT.ex.push(blankMove()); paintMoves(); return; }
  const brm = t.closest('[data-brm]');
  if(brm && EDIT){
    if(EDIT.ex.length<=1){ toast('A workout needs at least one movement.'); return; }
    EDIT.ex = EDIT.ex.filter(x=>String(x.k)!==brm.dataset.brm);
    paintMoves(); return;
  }
  if(t.closest('[data-bsave]') && EDIT){ saveBuilder(); return; }
  const bdel = t.closest('[data-bdel]'); if(bdel){ deleteBuilder(bdel.dataset.bdel); return; }

  const u = t.closest('[data-units]');
  if(u){ S.units=u.dataset.units; saveNow(); openSettings(); render(); return; }
  const th = t.closest('[data-pick-theme]');
  if(th){ S.theme=th.dataset.pickTheme; applyTheme(); saveNow(); openSettings(); return; }

  /* runner interactions */
  const tick = t.closest('[data-tick]');
  if(tick){
    const row = tick.closest('.setrow'), card = tick.closest('[data-ex]');
    const nm = card.dataset.ex, j = +tick.dataset.tick;
    const s = S.draft.entries[nm][j];
    s.done = !s.done;
    if(s.done && !s.r){ const rin = row.querySelector('[data-f="r"]'); if(rin && rin.value) s.r = rin.value; }
    tick.setAttribute('aria-pressed', String(s.done));
    row.classList.toggle('on', s.done);
    card.classList.toggle('complete', S.draft.entries[nm].every(x=>x.done));
    if(s.done) startRest(tick.dataset.rest);
    save();
    return;
  }
  const add = t.closest('[data-add]');
  if(add){
    const nm = add.dataset.add;
    S.draft.entries[nm].push({w:'',r:'',done:false});
    save();
    const card = add.closest('[data-ex]');
    const j = S.draft.entries[nm].length-1;
    const div = document.createElement('div');
    div.className='setrow'; div.dataset.set=j;
    const rest = card.querySelector('[data-rest]').dataset.rest;
    div.innerHTML = `<span class="sn">${j+1}</span>
      <input type="number" inputmode="decimal" placeholder="${S.units}" data-f="w" aria-label="Weight set ${j+1}">
      <input type="number" inputmode="numeric" placeholder="reps" data-f="r" aria-label="Reps set ${j+1}">
      <button class="tick" data-tick="${j}" aria-pressed="false" data-rest="${rest}" aria-label="Complete set ${j+1}">${svgCheck()}</button>`;
    card.querySelector('.sets').appendChild(div);
    card.classList.remove('complete');
    return;
  }
  if(t.closest('#skipRest')){ clearInterval(restInt); const r=$('#rest'); if(r) r.remove(); return; }
  if(t.closest('#finishBtn') || t.closest('#runDone')){ finishWorkout(); return; }
  if(t.closest('#runMin')){ saveNow(); closeRunner(); render(); toast('Session saved — resume it from Today'); return; }
  if(t.closest('#discardBtn')){
    if(!confirm('Discard this session? Nothing will be logged.')) return;
    S.draft=null; saveNow(); closeRunner(); render(); return;
  }
  if(t.closest('#resumeBtn')){ resumeDraft(); return; }

  if(t.closest('#acctBtn')){ openAccount(); return; }
  const au = t.closest('[data-auth]');
  if(au){
    const api = (window.SL && SL.api) || null;
    const k = au.dataset.auth;
    if(k==='mode'){ AUTHMODE = AUTHMODE==='up' ? 'in' : 'up'; ACCOUNT.error=''; openAccount(); return; }
    if(!api){ toast('Sync is not set up on this copy.'); return; }
    if(k==='google') api.google();
    if(k==='out')    api.signOut();
    if(k==='sync')   api.syncNow();
    if(k==='submit') api.email(AUTHMODE, ($('#authEmail').value||'').trim(), $('#authPass').value||'');
    if(k==='reset')  api.reset(($('#authEmail').value||'').trim());
    return;
  }

  if(t.closest('#setBtn')){ openSettings(); return; }
  if(t.closest('#themeBtn')){
    S.theme = S.theme==='dark' ? 'light' : S.theme==='light' ? 'auto' : 'dark';
    applyTheme(); saveNow();
    toast(S.theme==='auto'?'Theme: match device':S.theme==='dark'?'Theme: dark':'Theme: light');
    return;
  }
  if(t.closest('#expBtn')){ exportData(); return; }
  if(t.closest('#wipeBtn')){
    if(!confirm('Erase every logged session and planned day on this device? This cannot be undone.')) return;
    S = structuredClone(blank); saveNow(); closeSheet(); applyTheme(); render(); toast('All data erased');
    return;
  }
});

document.addEventListener('input', e=>{
  const f = e.target.closest('[data-f]');
  if(f && S.draft){
    const card = f.closest('[data-ex]'), row = f.closest('.setrow');
    S.draft.entries[card.dataset.ex][+row.dataset.set][f.dataset.f] = f.value;
    save(); return;
  }
  if(e.target.id==='runNotes' && S.draft){ S.draft.notes = e.target.value; save(); return; }
  const b = e.target.closest('[data-b]');
  if(b && EDIT){ EDIT[b.dataset.b] = b.value; return; }
  const ef = e.target.closest('[data-e]');
  if(ef && EDIT){
    const row = EDIT.ex.find(x=>String(x.k)===ef.dataset.k);
    if(row) row[ef.dataset.e] = ef.value;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='impFile' && e.target.files[0]) importData(e.target.files[0]);
});

/* ══════════════════════════════════════ data io ═════════════════════════ */
let DL;                                   // downloads capability, when the host grants one
(async ()=>{
  try{ DL = (window.claude && claude.use) ? await claude.use('downloads') : null; }
  catch(e){ DL = null; }
})();

async function exportData(){
  const json = JSON.stringify(S,null,2);
  const name = `split-ledger-${todayIso()}.json`;
  if(DL){
    try{ await DL.save({filename:name, data:json}); toast('Backup saved'); }
    catch(err){ if(!err || err.code!=='declined') toast('Could not save the backup.'); }
    return;
  }
  const blob = new Blob([json],{type:'application/json'});
  // iPhone: the share sheet is the only route to Files / AirDrop / Mail.
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Split Ledger backup'});
      toast('Backup shared');
      return;
    }
  }catch(err){ if(err && err.name==='AbortError') return; }

  if(!window.claude && 'download' in document.createElement('a')){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Backup downloaded');
    return;
  }
  try{ await navigator.clipboard.writeText(json); toast('Backup copied to the clipboard'); }
  catch(e){ toast('Saving is unavailable here — try a different browser.'); }
}
function importData(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d!=='object' || !Array.isArray(d.sessions)) throw 0;
      S = Object.assign(structuredClone(blank), d);
      saveNow(); applyTheme(); closeSheet(); render();
      toast(`Imported ${S.sessions.length} sessions`);
    }catch(err){ toast('That file is not a Split Ledger backup.'); }
  };
  fr.readAsText(file);
}

/* ══════════════════════════════════════ sync bridge ═════════════════════ */
/* The optional account layer lives in sync.js. It talks to the app only
   through window.SL, so the dashboard works exactly the same without it. */

let ACCOUNT = {status:'off', email:'', lastSync:0, error:''};
let AUTHMODE = 'in';

function remember_deleted(id){
  S.tomb = S.tomb || [];
  if(!S.tomb.includes(id)) S.tomb.push(id);
  if(S.tomb.length > 800) S.tomb = S.tomb.slice(-800);
}

function localSnapshot(){
  return {units:S.units, theme:S.theme, scheduled:S.scheduled||{},
          sessions:S.sessions||[], custom:S.custom||[], tomb:S.tomb||[],
          updatedAt:S.updatedAt||0};
}

/* Union the two ledgers. Newer side wins the single-value fields; lists are
   merged by id, minus anything either device has deleted. */
function mergeState(remote, local){
  const tomb = new Set([...(local.tomb||[]), ...(remote.tomb||[])]);
  const rNewer = (remote.updatedAt||0) > (local.updatedAt||0);

  const byId = (a,b)=>{
    const m = new Map();
    [...(a||[]), ...(b||[])].forEach(x=>{ if(x && x.id && !tomb.has(x.id)) m.set(x.id, x); });
    return [...m.values()];
  };
  // the same workout logged twice on the same day is one session, not two
  const sessions = [];
  const seen = new Map();
  byId(local.sessions, remote.sessions)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0)
    .forEach(x=>{
      const k = x.date + '|' + x.workoutId;
      const prev = seen.get(k);
      if(prev){ if((x.setCount||0) > (prev.setCount||0)) sessions[sessions.indexOf(prev)] = x, seen.set(k,x); return; }
      seen.set(k,x); sessions.push(x);
    });

  return {
    units:  rNewer ? (remote.units||local.units) : (local.units||remote.units),
    theme:  rNewer ? (remote.theme||local.theme) : (local.theme||remote.theme),
    scheduled: rNewer ? {...local.scheduled, ...remote.scheduled} : {...remote.scheduled, ...local.scheduled},
    sessions, custom: byId(local.custom, remote.custom), tomb:[...tomb],
    updatedAt: Math.max(remote.updatedAt||0, local.updatedAt||0)
  };
}

window.SL = {
  snapshot: localSnapshot,
  /* sync.js hands us the merged ledger; we adopt it and repaint. */
  adopt(next){
    Object.assign(S, next);
    saveNow(); applyTheme(); render();
    if($('#layer').innerHTML && $('#layer').querySelector('[data-auth]')) openAccount();
  },
  merge: mergeState,
  /* sync.js reports auth + sync status here. */
  setAuth(info){
    ACCOUNT = Object.assign({status:'off', email:'', lastSync:0, error:''}, info);
    paintAccountBtn();
    if($('#layer').innerHTML && $('#layer').querySelector('[data-auth]')) openAccount();
  },
  toast,
  api: null   // filled in by sync.js: {google, email, reset, signOut, syncNow}
};

function paintAccountBtn(){
  const b = $('#acctBtn'); if(!b) return;
  const on = ACCOUNT.status==='in';
  b.innerHTML = on
    ? `<span class="acct-i">${esc((ACCOUNT.email||'?')[0].toUpperCase())}</span>`
    : `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>`;
  b.classList.toggle('synced', on);
  b.classList.toggle('busy', ACCOUNT.status==='busy');
  b.setAttribute('aria-label', on ? `Account — ${ACCOUNT.email}` : 'Sign in to sync');
}

function syncAgo(){
  if(!ACCOUNT.lastSync) return 'not yet';
  const s = Math.round((Date.now()-ACCOUNT.lastSync)/1000);
  if(s < 45) return 'just now';
  if(s < 3600) return Math.round(s/60)+' min ago';
  if(s < 86400) return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+' d ago';
}

function openAccount(){
  const A = ACCOUNT;
  let body;

  if(A.status==='off'){
    body = `<p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 16px">
        Accounts are not switched on for this copy of the dashboard. Your training is still saved
        on this device, and Settings → Export backup moves it anywhere you like.</p>`;
  } else if(A.status==='in'){
    body = `
      <div class="card" style="padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <span class="acct-big">${esc((A.email||'?')[0].toUpperCase())}</span>
        <span style="flex:1;min-width:0">
          <b style="display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis">${esc(A.email)}</b>
          <i style="font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)">Synced ${syncAgo()}</i>
        </span>
        <span class="pill done">${svgCheck()} On</span>
      </div>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px">
        Every session, plan and workout you build is saved to your account and pulled down on any
        device you sign in on. It keeps working offline and catches up when you reconnect.</p>
      <button class="btn ghost" data-auth="sync">Sync now</button>
      <button class="btn ghost" style="margin-top:10px" data-auth="out">Sign out</button>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">Signing out leaves this device's copy untouched.</p>`;
  } else {
    const up = AUTHMODE==='up';
    body = `
      <p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 16px">
        Your training is saved on this device already. An account backs it up and lets you pick up
        on your phone, your laptop, anywhere. It is optional — everything works signed out.</p>
      ${A.error?`<p class="autherr">${esc(A.error)}</p>`:''}
      <button class="btn ghost" data-auth="google" ${A.status==='busy'?'disabled':''}>
        <svg viewBox="0 0 24 24" style="stroke:none"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1z"/></svg>
        Continue with Google</button>
      <div class="orbar"><span>or</span></div>
      <label class="fld"><span class="lb">Email</span>
        <input type="email" id="authEmail" autocomplete="email" inputmode="email" autocapitalize="none" placeholder="you@example.com"></label>
      <label class="fld"><span class="lb">Password</span>
        <input type="password" id="authPass" autocomplete="${up?'new-password':'current-password'}" placeholder="${up?'At least 6 characters':'Your password'}"></label>
      <button class="btn" data-auth="submit" ${A.status==='busy'?'disabled':''}>${up?'Create account':'Sign in'}</button>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <button class="linkish" data-auth="mode">${up?'I already have an account':'Create an account'}</button>
        ${up?'':'<button class="linkish" data-auth="reset">Forgot password?</button>'}
      </div>`;
  }

  sheet(`
    <div class="sheet-hd">
      <div style="flex:1">
        <div class="sub">${A.status==='in'?'Account':'Sync'}</div>
        <h2>${A.status==='in'?'Your account':'Sync your training'}</h2>
      </div>
      <button class="icon-btn" data-close aria-label="Close">${svgX()}</button>
    </div>
    ${body}`);
}

/* ══════════════════════════════════════ theme / boot ════════════════════ */
function applyTheme(){
  if(S.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', S.theme);
}
applyTheme();
render();

/* offline support — only when this is the top-level page on a real origin */
if('serviceWorker' in navigator && window.top===window.self &&
   (location.protocol==='https:' || location.hostname==='localhost')){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* resume banner for an unfinished session */
if(S.draft){
  const o = getOpt(S.draft.workoutId);
  if(o){
    const b = document.createElement('div');
    b.className='toast'; b.style.animation='none'; b.style.opacity='1'; b.style.pointerEvents='auto';
    b.style.display='flex'; b.style.gap='12px'; b.style.alignItems='center';
    b.innerHTML = `<span>Unfinished: ${esc(o.name)}</span><button id="resumeBtn" style="color:inherit;font-weight:600;text-decoration:underline">Resume</button>`;
    document.body.appendChild(b);
    setTimeout(()=>{ b.style.transition='opacity .4s'; b.style.opacity='0'; setTimeout(()=>b.remove(),450); }, 8000);
  } else { S.draft=null; save(); }
}
</script>
