/* ══════════════════════════════════════ coach ═══════════════════════════
   Reads a plain-English request and composes a plan out of the movement
   library. No model, no network — a parser plus a set of split templates,
   so it works offline and costs nothing. renderPlan() takes a plain plan
   object, so a real model could replace buildPlan() without touching the UI.
   ════════════════════════════════════════════════════════════════════════ */

const GOALS = {
  mass:     {id:'mass',     name:'Size & aesthetics', track:'strength',   sets:4, reps:'8–12',  rest:'1:30', iso:2},
  strength: {id:'strength', name:'Maximal strength',  track:'strength',   sets:4, reps:'4–6',   rest:'3:00', iso:0},
  athletic: {id:'athletic', name:'Athleticism',       track:'athletic',   sets:3, reps:'5–8',   rest:'1:30', iso:0},
  lean:     {id:'lean',     name:'Lean & conditioned',track:'strength',   sets:3, reps:'12–15', rest:'1:00', iso:2},
  base:     {id:'base',     name:'Building a base',   track:'foundation', sets:3, reps:'10–12', rest:'1:15', iso:1},
  mobility: {id:'mobility', name:'Mobility',          track:'mobility',   sets:2, reps:'',      rest:'0:30', iso:0}
};
const NUMWORD = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,a:1};

/* "deadlifts" must match "Deadlift (conventional)", so compare on stems. */
function stemWord(w){ return String(w).toLowerCase().replace(/(?:es|s)$/,''); }
function mentions(name, term){
  const n = ' ' + name.toLowerCase().replace(/[^a-z ]/g,' ') + ' ';
  return term.split(/\s+/).filter(Boolean).every(w=>{
    const st = stemWord(w);
    return st.length>2 && new RegExp('\\b' + st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(n);
  });
}

const FOCUS_SLOTS = {
  arms:      [['d4','Biceps'],['d2','Triceps'],['d4','Biceps stretch']],
  chest:     [['d2','Chest volume'],['d2','Second chest']],
  back:      [['d4','Row volume'],['d4','Lat volume']],
  shoulders: [['d2','Side delts'],['d2','Overhead']],
  legs:      [['d1','Single leg'],['d1','Quads']],
  glutes:    [['d3','Glutes'],['d3','Hamstring — hip extension']],
  core:      [['d1','Core'],['d3','Core']],
  calves:    [['d1','Calves'],['d3','Calves']]
};

function parseRequest(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const r = {raw:text, days:0, goal:null, focus:[], avoid:[], split:null, mins:0, equip:null};

  // days per week
  let m = t.match(/(\d+)\s*(?:x|times?|days?)\s*(?:a|per|\/)?\s*(?:week|wk)?/);
  if(m) r.days = +m[1];
  if(!r.days){
    m = t.match(/\b(one|two|three|four|five|six|seven)\s*(?:x|days?|times?)/);
    if(m) r.days = NUMWORD[m[1]];
  }
  if(r.days < 1 || r.days > 7) r.days = 0;

  // goal
  if(/\bmass\b|hypertroph|\bsize\b|bulk|aesthet|asthet|athstet|muscle|jacked|bigger/.test(t)) r.goal = 'mass';
  else if(/\bstrength\b|stronger|powerlift|1rm|max\b|heavy/.test(t))                          r.goal = 'strength';
  else if(/athletic|explosive|speed|sprint|vertical|jump|sport|agil/.test(t))                 r.goal = 'athletic';
  else if(/lean|cut|shred|tone|fat loss|conditioning|endurance/.test(t))                      r.goal = 'lean';
  else if(/beginner|new to|starting out|never|coming back|returning|out of shape/.test(t))    r.goal = 'base';
  else if(/mobility|flexib|stretch|recovery/.test(t))                                         r.goal = 'mobility';
  else r.goal = 'mass';

  // explicit split
  if(/push.?pull.?legs|\bppl\b/.test(t))      r.split = 'ppl';
  else if(/upper.?lower/.test(t))             r.split = 'ul';
  else if(/full.?body/.test(t))               r.split = 'full';
  else if(/bro split|body ?part/.test(t))     r.split = 'ppl';

  // emphasis — strip the split name first so "push pull legs" is not a legs focus
  const ft = t.replace(/push.?pull.?legs|\bppl\b|upper.?lower|full.?body|leg day|arm day|push day|pull day/g,' ');
  Object.keys(FOCUS_SLOTS).forEach(k=>{
    const alt = {arms:'arm|bicep|tricep', chest:'chest|pec', back:'back|lat', shoulders:'shoulder|delt',
                 legs:'leg|quad|thigh', glutes:'glute|butt', core:'core|abs|ab\\b', calves:'calf|calves'}[k];
    if(new RegExp(alt).test(ft)) r.focus.push(k);
  });

  // things to leave out
  const avoid = t.match(/\b(?:no|without|avoid|can't do|cant do|skip|hate)\s+([a-z \-]{3,40})/g) || [];
  avoid.forEach(a=>{
    const term = a.replace(/\b(?:no|without|avoid|can't do|cant do|skip|hate)\s+/,'').trim();
    term.split(/\s+(?:and|or)\s+/).forEach(x=>{
      x = x.trim().replace(/\b(?:please|thanks|at all|exercises?|movements?|work)\b/g,'').trim();
      if(x.length>2) r.avoid.push(stemWord(x));
    });
  });

  // equipment named in the request overrides the global filter
  if(/dumbbell|free ?weight|barbell only|just (?:a )?barbell/.test(t))        r.equip = ['free'];
  else if(/machines? only|just machines|machine ?based/.test(t))             r.equip = ['machine'];
  else if(/body ?weight|no (?:equipment|gym|weights)|at home|home workout|calisthenic/.test(t)) r.equip = ['body'];
  else if(/bands? only|resistance bands? only/.test(t))                      r.equip = ['other'];
  else if(/\bgym\b|commercial gym|full gym|everything/.test(t))              r.equip = EQUIP.map(e=>e.id);

  // session length
  m = t.match(/(\d+)\s*(?:min|minute)/);
  if(m) r.mins = +m[1];
  else if(/half (?:an )?hour/.test(t)) r.mins = 30;
  else if(/\ban hour\b|60/.test(t))    r.mins = 60;

  if(!r.days) r.days = r.goal==='mobility' ? 3 : 4;
  return r;
}

/* Which pools each training day draws from. */
function splitTemplate(req){
  const d = req.days, g = req.goal;
  const P = (label, src, emph) => ({label, src, emph:emph||[]});
  const T = g==='mobility' ? 'm' : null;   // mobility plans stay in mobility pools

  if(req.split==='full' || d<=2){
    const rota = [ [['d1',4],['d2',3]], [['d3',4],['d4',3]], [['d2',3],['d3',2],['d1',2]] ];
    const out=[];
    for(let i=0;i<Math.max(1,d);i++) out.push(P('Full Body ' + 'ABCDEFG'[i], rota[i%3]));
    return out;
  }
  if(req.split==='ul' || (d===4 && req.split==='ul')){
    return [P('Upper A',[['d2',4],['d4',3]]), P('Lower A',[['d1',4],['d3',3]]),
            P('Upper B',[['d4',4],['d2',3]]), P('Lower B',[['d3',4],['d1',3]])].slice(0,d);
  }
  if(d===3) return [P('Push',[['d2',6]]), P('Pull',[['d4',6]]), P('Legs',[['d1',4],['d3',3]])];
  if(d===4) return [P('Lower — Squat',[['d1',7]]), P('Upper — Push',[['d2',7]]),
                    P('Lower — Hinge',[['d3',7]]), P('Upper — Pull',[['d4',7]])];
  if(d===5) return [P('Push',[['d2',6]]), P('Pull',[['d4',6]]), P('Legs — Squat',[['d1',6]]),
                    P('Legs — Hinge',[['d3',6]]), P('Arms & Shoulders',[['d4',3],['d2',3]], ['arms','shoulders'])];
  if(d===6) return [P('Push A',[['d2',6]]), P('Pull A',[['d4',6]]), P('Legs A',[['d1',6]]),
                    P('Push B',[['d2',6]]), P('Pull B',[['d4',6]]), P('Legs B',[['d3',6]])];
  return [P('Push A',[['d2',6]]), P('Pull A',[['d4',6]]), P('Legs A',[['d1',6]]),
          P('Push B',[['d2',6]]), P('Pull B',[['d4',6]]), P('Legs B',[['d3',6]]),
          P('Mobility & Recovery',[['d1',3],['d2',3]], [])];
}

/* Reps and sets follow the goal, except where the movement's own prescription
   is the point — jumps, throws, carries and timed holds. */
function applyGoal(x, goal, isMobilityDay){
  const G = GOALS[goal];
  const ownPrescription = /yd|s$|s\b|breath|each way/.test(String(x.reps)) ||
                          /jump|bound|throw|slam|sprint|carry|hop|snatch|clean|hang|plank|hold|stretch|shuttle/i.test(x.nm);
  if(isMobilityDay || ownPrescription || !G.reps) return {...x};
  return {...x, sets:G.sets, reps:G.reps, rest:G.rest};
}

/* The goal picks a preferred track, but if the equipment filter guts that
   track we use whichever one actually has movements to give. */
const TRACK_PREF = {
  mass:['strength','foundation','athletic'], strength:['strength','foundation'],
  athletic:['athletic','foundation','strength'], lean:['strength','athletic','foundation'],
  base:['foundation','strength','athletic'], mobility:['mobility']
};
function trackCoverage(track, allowed){
  let have = 0, total = 0;
  ['d1','d2','d3','d4'].forEach(d=>{
    (POOLS[d + tsfx(track)] || []).forEach(sl=>{
      total++;
      if(sl.opts.some(o=>allowed.includes(equipOf(o.nm)))) have++;
    });
  });
  return total ? have/total : 0;
}
function pickTrack(req, allowed){
  const prefs = TRACK_PREF[req.goal] || ['strength'];
  const scored = prefs.map(t=>({t, c:trackCoverage(t, allowed)}));
  const first = scored[0];
  if(first.c >= 0.6) return {track:first.t, swapped:false};
  const best = scored.slice().sort((a,b)=>b.c-a.c)[0];
  return {track:best.t, swapped:best.t !== first.t, coverage:best.c};
}

function buildPlan(req){
  const tpl = splitTemplate(req);
  const G = GOALS[req.goal];
  const avoid = req.avoid.filter(Boolean);
  const allowed = req.equip && req.equip.length ? req.equip : (S.equip || EQUIP.map(e=>e.id));
  const blocked = nm => avoid.some(a => mentions(nm, a)) || !allowed.includes(equipOf(nm));
  const chosen = pickTrack(req, allowed);
  const TRACK = chosen.track;

  const days = tpl.map(day=>{
    const ex = [], used = new Set();
    const isMob = req.goal === 'mobility';

    day.src.forEach(([dayId, take])=>{
      const key = dayId + tsfx(TRACK);
      const slots = POOLS[key] || [];
      let got = 0;
      slots.forEach(sl=>{
        if(got >= take) return;
        const pick = sl.opts.filter(o=>!blocked(o.nm) && !used.has(o.nm));
        if(!pick.length) return;
        const o = pick[Math.floor(Math.random()*pick.length)];
        used.add(o.nm); ex.push(applyGoal(o, req.goal, isMob)); got++;
      });
    });

    // emphasis: add the requested body parts on top
    const wanted = day.emph.length ? day.emph : req.focus;
    wanted.forEach(f=>{
      (FOCUS_SLOTS[f]||[]).forEach(([dayId, label])=>{
        if(ex.length >= 10) return;
        const key = dayId + tsfx(TRACK);
        const sl = (POOLS[key]||[]).find(s=>s.label===label);
        if(!sl) return;
        const pick = sl.opts.filter(o=>!blocked(o.nm) && !used.has(o.nm));
        if(!pick.length) return;
        const o = pick[Math.floor(Math.random()*pick.length)];
        used.add(o.nm); ex.push(applyGoal(o, req.goal, isMob));
      });
    });

    // trim to the requested length, or to a sane ceiling for the goal
    const CAP = {strength:75, mass:70, athletic:60, lean:50, base:50, mobility:30};
    const limit = req.mins || CAP[req.goal] || 65;
    let out = ex;
    while(out.length > 3 && estimateMins(out) > limit + 5) out = out.slice(0, -1);

    return {label:day.label, style:TRACK, ex:out, mins:estimateMins(out)};
  }).filter(d=>d.ex.length >= 3);       // a two-movement day is not a session

  return {
    id:'p'+Date.now().toString(36),
    name:`${req.days}-day ${G.name}`,
    goal:req.goal, goalName:G.name, days:req.days,
    focus:req.focus, avoid, equip:(S.equip||[]).slice(),
    created:todayIso(), sessions:days,
    track:TRACK, trackSwapped:chosen.swapped, asked:req.days
  };
}

function coachAsk(text){
  text = (text||'').trim();
  if(!text) return;
  S.chat = S.chat || []; S.plans = S.plans || [];
  S.chat.push({role:'user', text});

  const req = parseRequest(text);
  const plan = buildPlan(req);

  let note;
  if(!plan.sessions.length){
    note = 'Nothing in your library fits that. Widen the equipment filter in Workouts, or drop one of the exclusions.';
    S.chat.push({role:'app', text:note});
  } else {
    const G = GOALS[plan.goal];
    note = `${plan.sessions.length} days a week, built for ${G.name.toLowerCase()}.` +
      (plan.focus.length ? ` Extra ${plan.focus.join(' and ')} work added.` : '') +
      (plan.avoid.length ? ` Leaving out ${plan.avoid.join(', ')}.` : '') +
      (plan.trackSwapped ? ` Your equipment does not support the usual ${GOALS[plan.goal].track} movements for this, so it is drawn from the ${styleName(plan.track).toLowerCase()} pool instead.` : '') +
      (plan.sessions.length < plan.asked ? ` I could only fill ${plan.sessions.length} of the ${plan.asked} days you asked for — widen the equipment or drop an exclusion for the rest.` : '') +
      ` Tap a day to see the movements; the ▶ on each opens a demonstration.`;
    plan.sourceText = text;
    S.plans.push(plan);
    if(S.plans.length > 12) S.plans = S.plans.slice(-12);
    S.chat.push({role:'app', text:note, planId:plan.id});
  }
  if(S.chat.length > 40) S.chat = S.chat.slice(-40);
  saveNow(); render();
  setTimeout(scrollChat, 30);
}

function savePlan(p, schedule){
  S.custom = S.custom || [];
  const made = [];
  p.sessions.forEach(d=>{
    const rec = {
      id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
      style:d.style, name:`${d.label} · ${p.name}`, focus:p.goalName,
      gear:(p.equip||[]).length<EQUIP.length ? (p.equip||[]).map(equipName).join(' · ') : '',
      mins:d.mins, blurb:p.goalName, planned:true,
      ex:d.ex.map(x=>({nm:x.nm, sets:x.sets, reps:x.reps, rest:x.rest, cue:x.cue||''}))
    };
    S.custom.push(rec); made.push(rec);
  });

  if(schedule){
    // next 4 weeks, training days first, resting on the days the plan does not use
    const order = [1,2,3,5,6,4,0];                       // Mon,Tue,Wed,Fri,Sat,Thu,Sun
    const slots = order.slice(0, made.length).sort((a,b)=>a-b);
    const start = new Date();
    for(let w=0; w<4; w++){
      made.forEach((rec,i)=>{
        const d = new Date(start);
        d.setDate(start.getDate() - start.getDay() + slots[i] + w*7);
        if(d < start && w===0) return;                   // never backfill
        S.scheduled[iso(d)] = {workoutId:rec.id, time:'17:30', note:''};
      });
    }
  }
  saveNow(); render();
  toast(schedule ? `${made.length} workouts saved and scheduled for 4 weeks`
                 : `${made.length} workouts saved to Your workouts`);
}

/* The optional account layer lives in sync.js. It talks to the app only
   through window.SL, so the dashboard works exactly the same without it. */

let ACCOUNT = {status:'off', email:'', lastSync:0, error:''};
let AUTHMODE = 'in';

function remember_deleted(id){
  S.tomb = S.tomb || [];
  if(!S.tomb.includes(id)) S.tomb.push(id);
  if(S.tomb.length > 800) S.tomb = S.tomb.slice(-800);
}

function localSnapshot(){
  return {units:S.units, theme:S.theme, scheduled:S.scheduled||{},
          sessions:S.sessions||[], custom:S.custom||[], tomb:S.tomb||[],
          updatedAt:S.updatedAt||0};
}

/* Union the two ledgers. Newer side wins the single-value fields; lists are
   merged by id, minus anything either device has deleted. */
function mergeState(remote, local){
  const tomb = new Set([...(local.tomb||[]), ...(remote.tomb||[])]);
  const rNewer = (remote.updatedAt||0) > (local.updatedAt||0);

  const byId = (a,b)=>{
    const m = new Map();
    [...(a||[]), ...(b||[])].forEach(x=>{ if(x && x.id && !tomb.has(x.id)) m.set(x.id, x); });
    return [...m.values()];
  };
  // the same workout logged twice on the same day is one session, not two
  const sessions = [];
  const seen = new Map();
  byId(local.sessions, remote.sessions)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0)
    .forEach(x=>{
      const k = x.date + '|' + x.workoutId;
      const prev = seen.get(k);
      if(prev){ if((x.setCount||0) > (prev.setCount||0)) sessions[sessions.indexOf(prev)] = x, seen.set(k,x); return; }
      seen.set(k,x); sessions.push(x);
    });

  return {
    units:  rNewer ? (remote.units||local.units) : (local.units||remote.units),
    theme:  rNewer ? (remote.theme||local.theme) : (local.theme||remote.theme),
    scheduled: rNewer ? {...local.scheduled, ...remote.scheduled} : {...remote.scheduled, ...local.scheduled},
    sessions, custom: byId(local.custom, remote.custom), tomb:[...tomb],
    updatedAt: Math.max(remote.updatedAt||0, local.updatedAt||0)
  };
}

window.SL = {
  snapshot: localSnapshot,
  /* sync.js hands us the merged ledger; we adopt it and repaint. */
  adopt(next){
    Object.assign(S, next);
    saveNow(); applyTheme(); render();
    if($('#layer').innerHTML && $('#layer').querySelector('[data-auth]')) openAccount();
  },
  merge: mergeState,
  /* sync.js reports auth + sync status here. */
  setAuth(info){
    ACCOUNT = Object.assign({status:'off', email:'', lastSync:0, error:''}, info);
    paintAccountBtn();
    if($('#layer').innerHTML && $('#layer').querySelector('[data-auth]')) openAccount();
  },
  toast,
  api: null   // filled in by sync.js: {google, email, reset, signOut, syncNow}
};

function paintAccountBtn(){
  const b = $('#acctBtn'); if(!b) return;
  const on = ACCOUNT.status==='in';
  b.innerHTML = on
    ? `<span class="acct-i">${esc((ACCOUNT.email||'?')[0].toUpperCase())}</span>`
    : `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>`;
  b.classList.toggle('synced', on);
  b.classList.toggle('busy', ACCOUNT.status==='busy');
  b.setAttribute('aria-label', on ? `Account — ${ACCOUNT.email}` : 'Sign in to sync');
}

function syncAgo(){
  if(!ACCOUNT.lastSync) return 'not yet';
  const s = Math.round((Date.now()-ACCOUNT.lastSync)/1000);
  if(s < 45) return 'just now';
  if(s < 3600) return Math.round(s/60)+' min ago';
  if(s < 86400) return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+' d ago';
}
