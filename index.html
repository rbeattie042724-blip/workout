<meta charset="utf-8">
<title>Split Ledger</title>
<meta name="description" content="A full-body training split, planned on a calendar and logged set by set.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split Ledger">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F1EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ── tokens ────────────────────────────────────────────────────────────── */
:root{
  --bg:#F2F1EE;
  --surface:#FFFFFF;
  --surface-2:#F8F7F4;
  --ink:#17171A;
  --ink-2:#43444A;
  --muted:#78787E;
  --line:#E4E2DD;
  --line-2:#D2CFC9;
  --strength:#3C4149;
  --strength-soft:#EDECEA;
  --athletic:#8A7250;
  --athletic-soft:#F3EEE5;
  --foundation:#55634F;
  --foundation-soft:#EAEFE7;
  --mobility:#5F5766;
  --mobility-soft:#EFEBF1;
  --good:#46685E;
  --good-soft:#E6EEEA;
  --danger:#93463A;
  --warn:#7C6A45;
  --shadow:0 1px 2px rgba(17,20,27,.06), 0 8px 24px -12px rgba(17,20,27,.18);
  --shadow-lift:0 2px 6px rgba(17,20,27,.08), 0 24px 48px -20px rgba(17,20,27,.35);
  --r-s:8px; --r-m:14px; --r-l:20px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --disp:"Archivo","IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10;
    --surface:#17171A;
    --surface-2:#1E1E22;
    --ink:#F0EFEC;
    --ink-2:#C6C4BF;
    --muted:#8A8985;
    --line:#26262A;
    --line-2:#35353B;
    --strength:#AEB4BF;
    --strength-soft:#22242A;
    --athletic:#C9A87E;
    --athletic-soft:#2A231A;
    --foundation:#A3B79B;
    --foundation-soft:#1C231A;
    --mobility:#B3A6BC;
    --mobility-soft:#232029;
    --good:#86B3A6;
    --good-soft:#16231F;
    --danger:#E0907E;
    --warn:#C2A46E;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#17171A; --surface-2:#1E1E22; --ink:#F0EFEC; --ink-2:#C6C4BF;
  --muted:#8A8985; --line:#26262A; --line-2:#35353B;
  --strength:#AEB4BF; --strength-soft:#22242A; --athletic:#C9A87E; --athletic-soft:#2A231A;
  --good:#86B3A6; --good-soft:#16231F; --danger:#E0907E; --warn:#C2A46E;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--strength);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}

.wrap{max-width:660px;margin:0 auto;padding:0 16px 132px}

/* ── header ────────────────────────────────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);
}
.top-in{max-width:660px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden}
.brand b{
  font-family:var(--disp);font-weight:800;font-stretch:116%;font-size:17px;
  letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
}
.brand span{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── nav ───────────────────────────────────────────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.nav-in{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px 5px;
  border-radius:12px;color:var(--muted);font-size:9.5px;letter-spacing:.01em;font-weight:500;
}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button[aria-selected="true"] svg{stroke-width:2.1}

/* ── generic bits ──────────────────────────────────────────────────────── */
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:block;margin:26px 0 10px;
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;
}
.t-strength{--track:var(--strength);--track-soft:var(--strength-soft)}
.t-athletic{--track:var(--athletic);--track-soft:var(--athletic-soft)}
.t-foundation{--track:var(--foundation);--track-soft:var(--foundation-soft)}
.t-mobility{--track:var(--mobility);--track-soft:var(--mobility-soft)}
.pill.track{color:var(--track);border-color:color-mix(in srgb,var(--track) 38%,transparent);background:var(--track-soft)}
.pill.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 38%,transparent);background:var(--good-soft)}
.pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;font-weight:600;font-size:15px;
  background:var(--ink);color:var(--surface);width:100%;transition:transform .12s;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px}
.empty{color:var(--muted);font-size:14px;padding:22px 4px;text-align:center}

/* ── today ─────────────────────────────────────────────────────────────── */
.hero{padding:20px 0 4px}
.hero .date{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(26px,7.4vw,34px);font-weight:800;font-stretch:112%;line-height:1.06;margin-top:6px}
.hero .sub-line{margin-top:7px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hero .sub-line b{color:var(--ink);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 4px}
.ws{
  border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.ws .d{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ws .n{font-family:var(--disp);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ws .dot{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.ws.has .dot{background:var(--track,var(--strength))}
.ws.done .dot{background:var(--ink);width:6px;height:6px}
.ws.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

.session-card{padding:16px;display:flex;flex-direction:column;gap:14px;margin-top:14px;position:relative;overflow:hidden}
.session-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--track,var(--strength))}
.session-card.done::before{background:var(--good)}
.sc-head{display:flex;align-items:flex-start;gap:10px}
.sc-head h2{font-size:20px;font-weight:700;font-stretch:108%;flex:1;line-height:1.15}
.sc-meta{display:flex;flex-wrap:wrap;gap:6px}
.sc-list{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.sc-list div{display:flex;justify-content:space-between;gap:12px}
.sc-list span{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--disp);font-weight:800;font-stretch:112%;font-size:26px;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);font-stretch:100%}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2px}

/* ── calendar ──────────────────────────────────────────────────────────── */
.cal-head{display:flex;align-items:center;gap:8px;margin:20px 0 12px}
.cal-head h2{flex:1;font-size:21px;font-weight:700;font-stretch:110%}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dow span{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{
  aspect-ratio:1/1.12;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:2px;
  transition:transform .1s;
}
.cell:active{transform:scale(.94)}
.cell.out{opacity:.32}
.cell .n{font-family:var(--disp);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cell.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell.today .n{color:var(--ink);font-weight:800}
.cell .dots{display:flex;gap:3px;height:5px;align-items:center}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block}
.tdot{background:var(--track)}
.dot-done{background:var(--ink);width:6px!important;height:6px!important}
.cell.sel{border-color:var(--ink);background:var(--surface-2)}
.cell.done{
  background:color-mix(in srgb,var(--track,var(--good)) 18%,var(--surface));
  border-color:color-mix(in srgb,var(--track,var(--good)) 55%,transparent);
  box-shadow:0 0 12px -2px color-mix(in srgb,var(--track,var(--good)) 70%,transparent),
             inset 0 0 0 1px color-mix(in srgb,var(--track,var(--good)) 22%,transparent);
}
.cell.done .n{color:var(--ink);font-weight:800}
.cell.done.today{box-shadow:0 0 12px -2px color-mix(in srgb,var(--track,var(--good)) 70%,transparent), inset 0 0 0 1.5px var(--ink)}
.ws.done{
  background:color-mix(in srgb,var(--track,var(--good)) 16%,var(--surface));
  border-color:color-mix(in srgb,var(--track,var(--good)) 45%,transparent);
  box-shadow:0 0 10px -3px color-mix(in srgb,var(--track,var(--good)) 70%,transparent);
}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* ── library ───────────────────────────────────────────────────────────── */
.day-block{margin-bottom:12px}
.day-hd{display:flex;align-items:baseline;gap:9px;margin:0 2px 8px}
.day-hd h3{font-size:16px;font-weight:700;font-stretch:108%}
.day-hd p{margin:0;font-size:11.5px;color:var(--muted)}
.opt{
  width:100%;text-align:left;padding:14px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-m);display:flex;flex-direction:column;gap:9px;margin-bottom:8px;
  position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .1s;
}
.opt:active{transform:scale(.99)}
.opt-wrap{position:relative}
.opt-fav{
  position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;color:var(--line-2);
}
.opt-fav svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.opt-fav[aria-pressed="true"]{color:var(--warn)}
.opt .opt-foot{padding-right:40px}
.badge.unfit{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.ex.unfit .nm{opacity:.5}
.ex.unfit .cue{opacity:.45}
.unfit-tag{
  display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  border-radius:999px;padding:1px 6px;margin-top:3px;
}
.badge{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;
}
.bigstat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;
}
.bigstat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.bigstat .v{font-family:var(--disp);font-weight:800;font-stretch:112%;font-size:clamp(30px,9vw,40px);
  line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigstat .v small{font-size:15px;font-weight:600;color:var(--muted);font-stretch:100%;letter-spacing:0}
.bigstat p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--track,var(--strength))}
.opt-top{display:flex;align-items:center;gap:10px}
.opt-top h4{margin:0;font-family:var(--disp);font-size:16px;font-weight:700;font-stretch:106%;flex:1}
.opt p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.opt-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* exercise table */
.ex-list{display:flex;flex-direction:column;gap:0;margin-top:2px}
.ex{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:16px;flex:none;padding-top:2px}
.ex .body{display:block;flex:1;min-width:0}
.ex .nm{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.ex .cue{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.42}
.ex .rx{
  font-family:var(--mono);font-size:12.5px;font-weight:500;text-align:right;white-space:nowrap;
  flex:none;padding-top:1px;font-variant-numeric:tabular-nums;
}
.ex .rest{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}
.demo{
  display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;
  border-radius:8px;border:1px solid var(--line-2);color:var(--muted);margin-left:2px;text-decoration:none;
}
.demo svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round}
.demo:active{color:var(--ink);border-color:var(--ink)}
.ex-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.run-ex h4 .demo{vertical-align:middle;margin-left:6px}

/* ── sheet ─────────────────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(8,10,15,.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;animation:fade .18s forwards;
}
@keyframes fade{to{opacity:1}}
.sheet{
  width:100%;max-width:660px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lift);
  border-top:1px solid var(--line);transform:translateY(14px);animation:up .24s cubic-bezier(.2,.8,.2,1) forwards;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));
}
@keyframes up{to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none;opacity:1;transform:none}}
.sheet-hd{
  position:sticky;top:0;background:var(--surface);padding:14px 0 12px;z-index:2;
  display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sheet-hd h2{flex:1;font-size:20px;font-weight:700;font-stretch:108%;line-height:1.2}
.sheet-hd .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto -4px}

label.fld{display:block;margin-bottom:14px}
label.fld .lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input[type="time"],input[type="text"],input[type="number"],textarea,select{
  width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font-size:15px;
}
textarea{resize:vertical;min-height:64px;font-family:var(--sans)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:13px;font-weight:500;background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.pick{
  width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;
  padding:12px;display:flex;align-items:center;gap:11px;margin-bottom:7px;position:relative;overflow:hidden;
}
.pick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--track,var(--strength))}
.pick .t{flex:1;min-width:0}
.pick .t b{display:block;font-weight:600;font-size:14.5px}
.pick .t i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px}
.pick .check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.pick[aria-pressed="true"] .check{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}

/* ── runner ────────────────────────────────────────────────────────────── */
.runner{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.run-top{
  position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.run-top-in{max-width:660px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.run-top .t{flex:1;min-width:0}
.run-top .t b{display:block;font-family:var(--disp);font-weight:700;font-stretch:106%;font-size:16px;line-height:1.2}
.run-top .t i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.clock{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.run-ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.run-ex.complete{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.run-ex h4{margin:0;font-family:var(--disp);font-size:15.5px;font-weight:700;font-stretch:104%;line-height:1.25}
.run-ex .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.run-ex .cue{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.sets{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:7px;align-items:center}
.setrow .sn{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.setrow input{padding:9px 10px;text-align:center;font-family:var(--mono);font-size:14px;border-radius:9px}
.setrow input::placeholder{color:var(--muted);opacity:.6}
.tick{
  width:40px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);
  display:grid;place-items:center;color:var(--muted);
}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.setrow.on input{border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.addset{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:7px 0 0}
.resttimer{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;
  background:var(--ink);color:var(--surface);border-radius:999px;padding:11px 16px;display:flex;align-items:center;gap:11px;
  box-shadow:var(--shadow-lift);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
}
.resttimer button{color:inherit;opacity:.65;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.run-foot{max-width:660px;margin:0 auto;padding:6px 16px calc(90px + env(safe-area-inset-bottom))}

/* ── progress ──────────────────────────────────────────────────────────── */
.chart{display:flex;align-items:flex-end;gap:6px;height:112px;padding:12px 2px 0}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart .bx{width:100%;background:var(--strength);border-radius:5px 5px 2px 2px;min-height:3px;opacity:.55}
.chart .col.zero .bx{background:var(--line-2);opacity:1;height:2px!important;border-radius:1px}
.chart .col.now .bx{background:var(--ink);opacity:1}
.chart .lb{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.hitem:last-child{border-bottom:0}
.hitem .bd{flex:1;min-width:0}
.hitem .bd b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.hitem .bd i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.hitem .rt{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{width:3px;height:34px;border-radius:2px;background:var(--track,var(--strength));flex:none}
.prlist{display:flex;flex-direction:column}
.pr{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr b{flex:1;font-weight:500;font-size:14px}
.pr .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;font-weight:500}
.pr .e{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:64px;text-align:right}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:90;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:999px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lift);opacity:0;animation:toast 2.4s forwards;
  pointer-events:none;max-width:88vw;text-align:center;
}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}82%{opacity:1}100%{opacity:0}}

/* ── account ───────────────────────────────────────────────────────────── */
#acctBtn.synced{border-color:var(--good)}
.acct-i{
  width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:12px;line-height:1;
}
.acct-big{
  width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:17px;flex:none;
}
#acctBtn.busy{opacity:.55}
.orbar{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted)}
.orbar::before,.orbar::after{content:"";flex:1;height:1px;background:var(--line)}
.orbar span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.linkish{font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.autherr{
  font-size:13px;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:10px;
  padding:10px 12px;margin:0 0 14px;line-height:1.45;
  border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);
}
.btn[disabled]{opacity:.5;pointer-events:none}
label.btn{cursor:pointer}

/* ── workout builder ───────────────────────────────────────────────────── */
.bex{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px;margin-bottom:8px}
.bex-hd{display:flex;align-items:center;gap:8px}
.bex-hd .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:18px;flex:none}
.bex-hd input{flex:1;font-weight:600;background:var(--surface)}
.bex-x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);flex:none}
.bex-x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.bex-grid span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.bex-grid input{padding:8px 6px;font-size:14px;text-align:center;font-family:var(--mono);background:var(--surface)}
.bex .cuein{margin-top:7px;font-size:13.5px;background:var(--surface)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw-group{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:12px 0 7px;
}
.sw-group:first-of-type{margin-top:0}
.swatch{
  border:1px solid var(--line-2);border-radius:12px;padding:9px 8px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;gap:7px;
}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw-chips{display:flex;gap:3px}
.sw-chips i{width:13px;height:13px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.25)}
.sw-name{font-size:11.5px;font-weight:500}
.sw-chips[data-pv="neutral"] i:nth-child(1){background:#3C4149}
.sw-chips[data-pv="neutral"] i:nth-child(2){background:#8A7250}
.sw-chips[data-pv="neutral"] i:nth-child(3){background:#55634F}
.sw-chips[data-pv="neutral"] i:nth-child(4){background:#5F5766}
.sw-chips[data-pv="slate"] i:nth-child(1){background:#2F5D8A}
.sw-chips[data-pv="slate"] i:nth-child(2){background:#3F7D74}
.sw-chips[data-pv="slate"] i:nth-child(3){background:#5A6B86}
.sw-chips[data-pv="slate"] i:nth-child(4){background:#6B5F8A}
.sw-chips[data-pv="carbon"] i:nth-child(1){background:#111111}
.sw-chips[data-pv="carbon"] i:nth-child(2){background:#5C5C5C}
.sw-chips[data-pv="carbon"] i:nth-child(3){background:#8A8A8A}
.sw-chips[data-pv="carbon"] i:nth-child(4){background:#B0B0B0}
.sw-chips[data-pv="clay"] i:nth-child(1){background:#7A4A2E}
.sw-chips[data-pv="clay"] i:nth-child(2){background:#A8752B}
.sw-chips[data-pv="clay"] i:nth-child(3){background:#6B7355}
.sw-chips[data-pv="clay"] i:nth-child(4){background:#7C5B6B}
.sw-chips[data-pv="forest"] i:nth-child(1){background:#2C4A38}
.sw-chips[data-pv="forest"] i:nth-child(2){background:#8A6B26}
.sw-chips[data-pv="forest"] i:nth-child(3){background:#55705C}
.sw-chips[data-pv="forest"] i:nth-child(4){background:#4F6473}
.sw-chips[data-pv="ember"] i:nth-child(1){background:#4A3F55}
.sw-chips[data-pv="ember"] i:nth-child(2){background:#A34A28}
.sw-chips[data-pv="ember"] i:nth-child(3){background:#6E6156}
.sw-chips[data-pv="ember"] i:nth-child(4){background:#38636B}
.loadhint{
  display:block;font-family:var(--mono);font-size:10.5px;font-weight:500;margin-top:2px;
  color:var(--muted);letter-spacing:.02em;
}
.loadhint.log{color:var(--good)}
.addmv{width:100%;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  padding:11px 0;border:1px dashed var(--line-2);border-radius:11px;margin-bottom:16px}

/* ── movement progress ─────────────────────────────────────────────────── */
.mv{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mv:last-child{border-bottom:0}
.mv .bd{flex:1;min-width:0}
.mv .bd b{display:block;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .bd i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.mv .bd i em{font-style:normal;color:var(--good)}
.mv .bd i em.dn{color:var(--danger)}
.spark{width:56px;height:22px;flex:none;overflow:visible}
.spark path{fill:none;stroke:var(--strength);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--strength)}
.mv .rt{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;flex:none;font-weight:600}
.mv .rt em{display:block;font-style:normal;font-size:9.5px;color:var(--muted);font-weight:400;letter-spacing:.08em;margin-top:2px}
.bigchart{width:100%;height:auto;display:block;overflow:visible}
.bigchart .ar{fill:var(--strength);opacity:.12}
.bigchart .ln{fill:none;stroke:var(--strength);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bigchart .gd{stroke:var(--line);stroke-width:1}
.bigchart .pt{fill:var(--surface);stroke:var(--strength);stroke-width:1.7}
.bigchart .pt.last{fill:var(--strength)}
.bigchart text{fill:var(--muted);font-family:var(--mono);font-size:9px}

/* ── row-level delete ──────────────────────────────────────────────────── */
.hitem-main{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.hitem-x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);flex:none}
.hitem-x svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hitem-x:active{color:var(--danger);border-color:var(--danger)}


/* ── alternate palettes ────────────────────────────────────────────────── */

   variables, so a palette never needs a component rule of its own. */
:root[data-palette="slate"]{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14181D; --ink-2:#3E4650;
  --muted:#727B86; --line:#E0E5EA; --line-2:#CBD2DA;
  --strength:#2F5D8A; --strength-soft:#E7EEF5; --athletic:#3F7D74; --athletic-soft:#E5F0EE;
  --foundation:#5A6B86; --foundation-soft:#EAEEF4; --mobility:#6B5F8A; --mobility-soft:#EDEAF4;

  }
}

/* ── optional glow ─────────────────────────────────────────────────────── */
:root[data-fx="glow"] .pill.track{box-shadow:0 0 12px -3px var(--track)}
:root[data-fx="glow"] .opt::before,
:root[data-fx="glow"] .session-card::before,
:root[data-fx="glow"] .pick::before{box-shadow:0 0 14px 0 var(--track)}
:root[data-fx="glow"] .rail{box-shadow:0 0 10px 0 var(--track)}
:root[data-fx="glow"] .cell.done{
  box-shadow:0 0 22px -4px var(--track,var(--good)), inset 0 0 0 1px color-mix(in srgb,var(--track,var(--good)) 40%,transparent);
}
:root[data-fx="glow"] .ws.done{box-shadow:0 0 18px -5px var(--track,var(--good))}
:root[data-fx="glow"] .brand b{text-shadow:0 0 18px color-mix(in srgb,var(--strength) 55%,transparent)}
:root[data-fx="glow"] .btn:not(.ghost):not(.danger){box-shadow:0 0 20px -6px var(--ink)}
:root[data-fx="glow"] .nav button[aria-selected="true"]{text-shadow:0 0 12px color-mix(in srgb,var(--ink) 60%,transparent)}
:root[data-fx="glow"] .tick[aria-pressed="true"]{box-shadow:0 0 14px -2px var(--good)}
:root[data-fx="glow"] .bigstat .v,
:root[data-fx="glow"] .stat .v{text-shadow:0 0 16px color-mix(in srgb,var(--ink) 35%,transparent)}
@media (prefers-reduced-motion:reduce){:root[data-fx="glow"] *{text-shadow:none}}

/* ── coach ─────────────────────────────────────────────────────────────── */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0 12px}
.bub{max-width:92%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.55}
.bub p{margin:0}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:5px}
.bub.app{align-self:flex-start;background:var(--surface);border:1px solid var(--line);
  border-bottom-left-radius:5px;box-shadow:var(--shadow);max-width:100%;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chips .chip{font-size:12.5px;text-align:left;line-height:1.35}
.composer{
  display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--bg);padding:10px 0 8px;z-index:5;
}
.composer::before{
  content:"";position:absolute;left:0;right:0;top:-22px;height:22px;pointer-events:none;
  background:linear-gradient(to top, var(--bg), transparent);
}
.composer textarea{flex:1;min-height:46px;max-height:140px;resize:none;border-radius:14px;padding:13px 14px;font-size:15px}
.send{
  width:46px;height:46px;flex:none;border-radius:14px;background:var(--ink);color:var(--surface);
  display:grid;place-items:center;
}
.send svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send:active{transform:scale(.94)}

.plan{margin-top:12px}
.plan-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.plan-hd b{display:block;font-family:var(--disp);font-size:17px;font-weight:700;font-stretch:106%;line-height:1.2}
.plan-hd i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.pday{
  border:1px solid var(--line);border-radius:12px;background:var(--surface-2);
  margin-bottom:7px;overflow:hidden;position:relative;
}
.pday::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--track,var(--strength))}
.pday summary{
  display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;cursor:pointer;list-style:none;
}
.pday summary::-webkit-details-marker{display:none}
.pday[open] summary{border-bottom:1px solid var(--line)}
.pd-n{font-family:var(--mono);font-size:11px;color:var(--muted);width:14px;flex:none}
.pd-t{flex:1;min-width:0}
.pd-t b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.pd-t i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.pday .ex-list{padding:4px 12px 10px 14px}

<script>
/* ══════════════════════════════════════════════════════════════════════════
   PROGRAM — a full-body split: two lower days, two upper days.
   Each day offers a Strength option (barbell/machine, standard commercial-gym
   equipment) and an Athletic option (unilateral, explosive, reactive).
   ══════════════════════════════════════════════════════════════════════════ */
const PROGRAM = [
{ id:'d1', title:'Lower — Squat', focus:'Quads · Glutes · Adductors · Calves', short:'Squat',
  options:[

  { id:'d1a', style:'athletic', name:'Ground Force', mins:55, gear:'Box · DBs · bands',

{ id:'d2', title:'Upper — Push', focus:'Chest · Front & Side Delts · Triceps', short:'Push',

{ id:'d4', title:'Upper — Pull', focus:'Lats · Mid-Back · Rear Delts · Biceps · Grip', short:'Pull',

/* Look up a workout by id — the four built-in days, or one you built yourself. */
function getOpt(id){
  if(ALLOPTS[id]) return ALLOPTS[id];
  const c = (S.custom||[]).find(x=>x.id===id);

}

const KEY = 'splitledger.v1';
const blank = { units:'lb', theme:'auto', chat:[], plans:[], palette:'neutral', corners:'soft', fx:'', equip:['machine','free','body','other'], hideUnfit:false, scheduled:{}, sessions:[], custom:[], favs:[], weights:[], profile:null, tomb:[], draft:null };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(blank);
    return Object.assign(structuredClone(blank), JSON.parse(raw));
  }catch(e){ return structuredClone(blank); }
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast('Could not save — device storage is full or blocked.'); }
    if(window.SL && SL.api && SL.api.push) SL.api.push();
  }, 120);
}
function saveNow(){
  clearTimeout(saveTimer);
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(window.SL && SL.api && SL.api.push) SL.api.push();
}
addEventListener('pagehide', saveNow);
addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveNow(); });

/* ══════════════════════════════════════ helpers ═════════════════════════ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const todayIso = () => iso(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12 ? 'pm':'am'; const hh = h%12===0?12:h%12;
  return `${hh}:${pad(m)}${ap}`;
}
function relDay(d){
  const t = todayIso();
  if(d===t) return 'Today';
  const diff = Math.round((fromIso(d)-fromIso(t))/86400000);
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  const dt = fromIso(d);
  return `${DOW[dt.getDay()]} ${MON[dt.getMonth()].slice(0,3)} ${dt.getDate()}`;
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}
function svgCheck(){ return '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'; }
function svgTrash(){ return '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>'; }
function svgX(){ return '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }
function svgPlay(){ return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg>'; }

const EQUIP_RULES = [
  [/foam roller|med-ball|med ball|sled|dowel|\bband|banded|\brings?\b|trx|hurdle|slider|ab wheel|wheel rollout|strap|pinch/i, 'other'],
  [/machine|leg press|hack squat|belt squat|pec deck|smith |pulldown|cable|pushdown|reverse hyper|assisted|leg curl|leg extension|seated calf raise|standing calf raise|face pull|pallof|woodchop|pull-through|chest-supported row|seated row/i, 'machine'],
  [/weighted|barbell|dumbbell|kettlebell|trap-bar|trap bar|landmine|goblet|ez-bar|plate/i, 'free'],
  [/stretch|hold|plank|hang|cat-cow|open book|thread the needle|pigeon|figure-4|butterfly|90\/90|breathing|cars\b|chin tuck|upper trap|levator|wall |doorway|child pose|supine|quadruped|prone |rock-back|switch|sweep|squat to stand|pelvic tilt|tibialis|wrist|pronation|balance|bird dog|dead bug|hollow|bear crawl|copenhagen|nordic|cossack|pogo|bound|jump|sprint|shuttle|hill|step-down|air squat|bodyweight|sissy squat|single-leg calf raise|inverted row|ring row|pull-up|chin-up|push-up|\bdip\b|sit-up|leg raise|crunch|glute bridge|back extension|side plank|y-t-w|trap raise|adductor slide|hamstring curl|couch|frog|calf stretch|extensor|finger extension/i, 'body'],
];
function equipOf(nm){
  for(const [re, tag] of EQUIP_RULES) if(re.test(nm)) return tag;
  return 'free';           // anything left is a loaded barbell variant
}

function equipOk(nm){ const e = S.equip || EQUIP.map(x=>x.id); return e.includes(equipOf(nm)); }
function equipName(tag){ const e = EQUIP.find(x=>x.id===tag); return e ? e.name : tag; }
/* How much of a workout you can actually do with what you have selected. */
function fitOf(o){
  const ok = o.ex.filter(x=>equipOk(x.nm)).length;
  return {ok, total:o.ex.length, full: ok === o.ex.length};
}

function volumeOf(sess){
  let v=0;
  Object.values(sess.entries||{}).forEach(sets => sets.forEach(s=>{
    if(s.done && +s.w>0 && +s.r>0) v += (+s.w) * (+s.r);
  }));
  return Math.round(v);
}

function weekDates(anchor){
  const d = new Date(anchor); d.setDate(d.getDate() - d.getDay());
  return Array.from({length:7}, (_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return iso(x); });
}
function viewToday(){
  const t = todayIso();
  const wk = weekDates(new Date());
  const doneThisWeek = wk.filter(d=>sessOn(d)).length;
  const sch = S.scheduled[t];
  const done = sessOn(t);
  const opt = sch ? getOpt(sch.workoutId) : null;

  const strip = wk.map(d=>{
    const dt = fromIso(d), s = S.scheduled[d], o = s?getOpt(s.workoutId):null, fin = sessOn(d);
    const fo = fin ? getOpt(fin.workoutId) : null;
    const cls = ['ws', fin?'done':(o?'has':''), (fo||o)?tcls((fo||o).style):'', d===t?'today':''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-day="${d}"><span class="d">${DOW[dt.getDay()][0]}</span><span class="n">${dt.getDate()}</span><span class="dot"></span></button>`;
  }).join('');

  let card;

    const o = getOpt(done.workoutId);
    card = `<div class="card session-card done">

      <div class="row">
        <button class="btn ghost" data-hist="${done.id}">View session</button>

      </div>
    </div>`;
  } else if(opt){
    card = `<div class="card session-card ${tcls(opt.style)}">
      <div class="sc-head">
        <div style="flex:1">
          <div class="sc-meta" style="margin-bottom:6px">
            <span class="pill track">${styleName(opt.style)}</span>
            <span class="pill">${esc(dayTag(opt))}</span>
          </div>
          <h2>${esc(opt.name)}</h2>

      <div class="sc-meta">

        <span class="pill">${opt.ex.length} movements</span>
      </div>
      <div class="sc-list">${opt.ex.slice(0,4).map(x=>`<div><span style="color:var(--ink-2)">${esc(x.nm)}</span><span>${x.sets}×${esc(x.reps)}</span></div>`).join('')}

      ${sch.note?`<div style="font-size:13px;color:var(--muted);border-left:2px solid var(--line-2);padding-left:10px">${esc(sch.note)}</div>`:''}
      <div class="row">
        <button class="btn" data-start="${opt.id}" data-date="${t}"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg>Start workout</button>
        <button class="icon-btn" style="width:46px;height:46px" data-day="${t}" aria-label="Edit">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="icon-btn" style="width:46px;height:46px" data-unschedule="${t}" aria-label="Remove from calendar">${svgTrash()}</button>
      </div>
    </div>`;
  } else {
    const next = suggestNext();
    card = `<div class="card session-card" style="--x:0">
      <div class="sc-head"><h2 style="font-size:18px">Nothing scheduled</h2></div>
      <p style="margin:0;color:var(--muted);font-size:13.5px">Based on your history, next up in the rotation is <b style="color:var(--ink)">${esc(dayTag(next))}</b>.</p>
      <div class="row">
        <button class="btn" data-day="${t}">Schedule today</button>
        <button class="btn ghost" data-start="${next.id}" data-date="${t}" style="width:auto;padding:13px 16px;white-space:nowrap">Start now</button>
      </div>
    </div>`;
  }

  const streak = weekStreak();
  const mo = S.sessions.filter(s=>s.date.slice(0,7)===t.slice(0,7));
  const vol = mo.reduce((a,s)=>a+s.volume,0);

  let resume = '';
  if(S.draft && getOpt(S.draft.workoutId)){
    const dr = getOpt(S.draft.workoutId);
    const mins = Math.round((S.draft.elapsed||0)/60);
    const dn = Object.values(S.draft.entries).reduce((a,arr)=>a+arr.filter(x=>x.done).length,0);
    resume = `<div class="card session-card ${tcls(dr.style)}" style="margin-top:0">
      <div class="sc-head"><h2 style="font-size:17px">In progress · ${esc(dr.name)}</h2><span class="pill">${mins}m · ${dn} sets</span></div>
      <button class="btn" id="resumeBtn">Resume session</button></div>`;
  }

  return `
  <section class="hero">
    <div class="date">${DOW[new Date().getDay()]} · ${MON[new Date().getMonth()]} ${new Date().getDate()}</div>
    <h1>${greeting()}</h1>
    <div class="sub-line"><b>${doneThisWeek}</b> session${doneThisWeek===1?'':'s'} logged this week</div>
    <div class="weekstrip">${strip}</div>
  </section>
  ${resume || card}
  <span class="eyebrow">At a glance</span>
  <div class="stats">
    <div class="stat"><div class="k">This week</div><div class="v">${doneThisWeek}</div></div>
    <div class="stat"><div class="k">Week streak</div><div class="v">${streak}<small> wk</small></div>
      <div class="bar"><i style="width:${Math.min(100,streak*20)}%"></i></div></div>
    <div class="stat"><div class="k">Sessions in ${MON[new Date().getMonth()].slice(0,3)}</div><div class="v">${mo.length}</div></div>
    <div class="stat"><div class="k">Volume in ${MON[new Date().getMonth()].slice(0,3)}</div><div class="v">${fmtVol(vol)}<small> ${S.units}</small></div></div>
  </div>
  <span class="eyebrow">Coming up</span>
  ${upcoming()}
  `;
}
function greeting(){
  const h = new Date().getHours();
  if(h<12) return 'Good morning.';
  if(h<17) return 'Good afternoon.';
  return 'Good evening.';
}
function suggestNext(){
  const last = [...S.sessions].sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!last) return getOpt('d1s');
  const o = getOpt(last.workoutId);
  const i = PROGRAM.findIndex(d=>d.id===(o?o.day.id:'d1'));
  const nd = PROGRAM[(i+1)%4];
  return getOpt(nd.options[0].id);
}
function weekStreak(){
  // consecutive weeks (ending with the current or last week) you trained at all
  const counts = {};
  S.sessions.forEach(s=>{ const k = weekKey(fromIso(s.date)); counts[k]=(counts[k]||0)+1; });
  let streak=0; const cur = new Date();
  if(!counts[weekKey(cur)]) cur.setDate(cur.getDate()-7);
  while(counts[weekKey(cur)]){ streak++; cur.setDate(cur.getDate()-7); }
  return streak;
}
function weekKey(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); return iso(x); }

function upcoming(){
  const t = todayIso();
  const list = Object.keys(S.scheduled).filter(d=>d>t && !sessOn(d)).sort().slice(0,4);
  if(!list.length) return `<div class="card" style="padding:18px"><div class="empty">No sessions scheduled ahead. Open the calendar to plan your week.</div>
    <button class="btn ghost" data-goto="cal">Open calendar</button></div>`;
  return `<div class="card" style="padding:4px 14px">${list.map(d=>{
    const s = S.scheduled[d], o = getOpt(s.workoutId); if(!o) return '';
    return `<div class="hitem">
      <button class="hitem-main" data-day="${d}">
        <span class="rail ${tcls(o.style)}"></span>
        <span class="bd"><b>${esc(o.name)}</b><i>${relDay(d)}${s.time?' · '+fmtTime(s.time):''}</i></span>

  }).join('')}</div>`;
}

/* ── per-movement history ──────────────────────────────────────────────── */
function e1rm(w,r){ w=+w||0; r=+r||0; return r ? w*(1+r/30) : 0; }

/* One entry per movement you have logged, with a point per session. */
function movementStats(){
  const asc = [...S.sessions].sort((a,b)=> a.date<b.date ? -1 : 1);
  const map = {};
  asc.forEach(s=>{
    Object.entries(s.entries||{}).forEach(([nm,sets])=>{
      const done = (sets||[]).filter(x=>x.done && +x.r>0);
      if(!done.length) return;
      const loaded = done.some(x=>+x.w>0);
      const m = map[nm] || (map[nm] = {nm, mode:'reps', points:[]});
      if(loaded) m.mode = 'load';
      const top = done.reduce((a,b)=>
        (loaded ? e1rm(b.w,b.r) > e1rm(a.w,a.r) : (+b.r) > (+a.r)) ? b : a, done[0]);
      m.points.push({
        date:s.date, w:+top.w||0, r:+top.r, sets:done.length,
        vol:done.reduce((a,x)=>a+(+x.w||0)*(+x.r),0)
      });
    });
  });
  return Object.values(map).map(m=>{
    m.points.forEach(p=> p.m = m.mode==='load' ? Math.round(e1rm(p.w,p.r)) : p.r);
    m.sessions = m.points.length;
    m.best  = m.points.reduce((a,b)=> b.m>a.m ? b : a, m.points[0]);
    m.first = m.points[0];
    m.last  = m.points[m.points.length-1];
    m.delta = m.last.m - m.first.m;
    return m;
  }).sort((a,b)=> b.sessions-a.sessions || b.best.m-a.best.m);
}
function topSet(m,p){ return m.mode==='load' ? `${p.w}×${p.r}` : `${p.r} reps`; }
function metricLabel(m){ return m.mode==='load' ? 'e1RM' : 'reps'; }

function spark(vals){
  if(vals.length<2) return `<svg class="spark" viewBox="0 0 56 22" aria-hidden="true"><circle cx="28" cy="11" r="2.2"/></svg>`;
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const pt=vals.map((v,i)=>[2+i*(52/(vals.length-1)), 19-((v-mn)/rng)*16]);
  const d=pt.map((q,i)=>`${i?'L':'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' ');
  const l=pt[pt.length-1];
  return `<svg class="spark" viewBox="0 0 56 22" aria-hidden="true"><path d="${d}"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.2"/></svg>`;
}

function bigChart(m){
  const pts=m.points, W=320, H=160, L=36, R=10, T=14, B=26;
  const vals=pts.map(p=>p.m);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const lo=Math.max(0, Math.floor((mn - (mx-mn||mn*0.1||1)*0.35))), hi=Math.ceil(mx + (mx-mn||mx*0.1||1)*0.2) || 1;
  const rng=(hi-lo)||1;
  const X=i=> pts.length===1 ? L+(W-L-R)/2 : L + i*(W-L-R)/(pts.length-1);
  const Y=v=> T + (1-(v-lo)/rng)*(H-T-B);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.m).toFixed(1)}`).join(' ');
  const area=`${line} L${X(pts.length-1).toFixed(1)} ${(H-B).toFixed(1)} L${X(0).toFixed(1)} ${(H-B).toFixed(1)} Z`;
  const ticks=[lo, Math.round((lo+hi)/2), hi];
  const every=Math.max(1, Math.ceil(pts.length/4));
  return `<svg class="bigchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.nm)} over ${pts.length} sessions">
    ${ticks.map(v=>`<line class="gd" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
      <text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`).join('')}
    ${pts.length>1?`<path class="ar" d="${area}"/>`:''}
    <path class="ln" d="${line}"/>
    ${pts.map((p,i)=>`<circle class="pt ${i===pts.length-1?'last':''}" cx="${X(i).toFixed(1)}" cy="${Y(p.m).toFixed(1)}" r="3.2"/>`).join('')}
    ${pts.map((p,i)=> i%every===0||i===pts.length-1
      ? `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${fromIso(p.date).getMonth()+1}/${fromIso(p.date).getDate()}</text>` : '').join('')}
  </svg>`;
}

      <div class="stat"><div class="k">Change</div><div class="v" style="font-size:20px;color:${dir==='up'?'var(--good)':dir==='down'?'var(--athletic)':'inherit'}">${m.delta>0?'+':''}${m.delta}</div></div>

          <span class="rt">${p.m}${p.m===m.best.m?' ★':''}</span>
        </span></div>`).join('')}
    </div></div>
    <p style="color:var(--muted);font-size:12.5px;margin-top:14px;line-height:1.5">
      ${m.mode==='load'
        ? 'e1RM is your estimated one-rep max for the heaviest set of that session (Epley). It lets a set of 5 and a set of 10 be compared on one line.'
        : 'No weight was logged for this movement, so progress is tracked by the best set of reps.'}
    </p>`);
}

/* ══════════════════════════════════════ progress ════════════════════════ */
function viewProg(){
  if(!S.sessions.length){
    return `<span class="eyebrow">Progress</span>
    <div class="card" style="padding:26px 18px">
      <div class="empty">No sessions logged yet.<br>Finish a workout and your volume, personal bests, and history will build here.</div>

      <div class="k" style="margin-top:4px;font-size:9px">${(S.weights||[]).length} entr${(S.weights||[]).length===1?'y':'ies'} · tap to log</div>
    </button>

    </button>
  </div>
`;
  }
  const all = [...S.sessions].sort((a,b)=>a.date<b.date?1:-1);
  const totalVol = all.reduce((a,s)=>a+s.volume,0);
  const totalMin = all.reduce((a,s)=>a+s.durationMin,0);

  // last 8 weeks of volume
  const weeks=[]; const cur=new Date();
  for(let i=7;i>=0;i--){ const d=new Date(cur); d.setDate(d.getDate()-i*7); weeks.push(weekKey(d)); }
  const wv = weeks.map(k=>({k, v:S.sessions.filter(s=>weekKey(fromIso(s.date))===k).reduce((a,s)=>a+s.volume,0)}));
  const max = Math.max(1,...wv.map(w=>w.v));

  const moves = movementStats();

  const styleCount = {};
  TRACKS.forEach(t=>styleCount[t.id]=0);
  S.sessions.forEach(s=>{ const o=getOpt(s.workoutId); if(o && styleCount[o.style]!==undefined) styleCount[o.style]++; });

  return `<span class="eyebrow">All time</span>
  <div class="bigstat" style="margin-bottom:10px">

function paintMoves(){
  const box = $('#bEx'); if(box) box.innerHTML = EDIT.ex.map((x,i)=>moveRow(x,i)).join('');
}
function estimateMins(ex){
  let sec = 300;                                   // warm-up and transitions
  ex.forEach(x=>{
    const p = String(x.rest||'').split(':').map(Number);
    const rest = p.length===2 ? p[0]*60+(p[1]||0) : (p[0]||60);
    sec += (+x.sets||1) * (40 + rest);
  });
  return Math.max(10, Math.round(sec/60/5)*5);
}
function saveBuilder(){
  const name = (EDIT.name||'').trim();
  if(!name){ toast('Give the workout a name.'); return; }
  const ex = EDIT.ex
    .filter(x=>(x.nm||'').trim())
    .map(x=>({nm:x.nm.trim(), sets:Math.max(1,Math.min(20,+x.sets||3)),
              reps:String(x.reps||'').trim()||'8-10', rest:String(x.rest||'').trim()||REST_DEFAULT,
              cue:(x.cue||'').trim()}));
  if(!ex.length){ toast('Add at least one movement.'); return; }
  const rec = {
    id: EDIT.id || 'c'+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),
    style: TRACKS.some(t=>t.id===EDIT.style) ? EDIT.style : 'strength',
    name, focus:(EDIT.focus||'').trim(), gear:(EDIT.gear||'').trim(),
    mins: +EDIT.mins > 0 ? Math.round(+EDIT.mins) : estimateMins(ex),
    blurb:(EDIT.focus||'').trim(), ex
  };
  S.custom = S.custom || [];
  const i = S.custom.findIndex(c=>c.id===rec.id);
  if(i>=0) S.custom[i] = rec; else S.custom.push(rec);
  EDIT = null; saveNow(); closeSheet(); render();
  toast(`${rec.name} saved · ${ex.length} movements`);
}
function deleteBuilder(id){
  const c = (S.custom||[]).find(x=>x.id===id); if(!c) return;
  const planned = Object.keys(S.scheduled).filter(d=>S.scheduled[d].workoutId===id);
  const msg = planned.length
    ? `Delete ${c.name}? It is on your calendar ${planned.length} time${planned.length>1?'s':''} — those days will be cleared. Sessions you already logged are kept.`
    : `Delete ${c.name}? Sessions you already logged are kept.`;
  if(!confirm(msg)) return;
  planned.forEach(d=>delete S.scheduled[d]);
  S.custom = S.custom.filter(x=>x.id!==id);
  S.favs = (S.favs||[]).filter(f=>f!==id);
  remember_deleted(id);
  if(S.draft && S.draft.workoutId===id) S.draft = null;
  EDIT = null; saveNow(); closeSheet(); render();
  toast(`${c.name} deleted`);
}


/* ── randomizer ────────────────────────────────────────────────────────── */
let ROLLQ = {day:'d1', style:'strength'}, ROLL = null;

function rollWorkout(dayId, style){
  const key = dayId + tsfx(style);
  const slots = POOLS[key]; if(!slots) return null;
  const day = PROGRAM.find(d=>d.id===dayId);
  const ex = [];
  slots.forEach(sl=>{
    const pick = sl.opts.filter(o=>equipOk(o.nm));          // only what you have
    if(!pick.length) return;                                // nothing here fits — skip the slot
    if(sl.opt && Math.random() < 0.45) return;              // optional slots come and go
    const o = pick[Math.floor(Math.random()*pick.length)];
    if(ex.some(x=>x.nm===o.nm)) return;                     // never list a movement twice
    ex.push({...o});
  });
  if(ex.length < 3) return {thin:true, style, dayId, have:ex.length,
    slots:slots.length, name:day.short};
  const now = new Date();
  return {
    style, ex, dayId,
    name: `${day.short} Roll · ${MON[now.getMonth()].slice(0,3)} ${now.getDate()}`,
    focus: day.focus,
    gear: style==='strength' ? 'Commercial gym'
        : style==='foundation' ? 'Machines · dumbbells'
        : style==='mobility' ? 'Mat · band' : 'Mixed equipment',
    mins: estimateMins(ex)
  };
}

function commitRoll(start){
  if(!ROLL) return;
  const rec = {
    id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),
    style:ROLL.style, name:ROLL.name, focus:ROLL.focus, gear:ROLL.gear,
    mins:ROLL.mins, blurb:ROLL.focus, rolled:true,
    ex:ROLL.ex.map(x=>({nm:x.nm, sets:x.sets, reps:x.reps, rest:x.rest, cue:x.cue||''}))
  };
  S.custom = S.custom || [];
  S.custom.push(rec);
  const name = rec.name;
  ROLL = null; saveNow();
  if(start){ startWorkout(rec.id, todayIso()); return; }
  closeSheet(); render(); toast(`${name} saved to your workouts`);
}

/* ══════════════════════════════════════ runner ══════════════════════════ */
let restInt=null, clockInt=null;

function startWorkout(optId, date){
  const o = getOpt(optId); if(!o) return;
  if(S.draft && S.draft.workoutId !== optId){
    if(!confirm('You have an unfinished session in progress. Starting a new one will discard it.')) return;
  }
  if(!S.draft || S.draft.workoutId !== optId || S.draft.date !== date){
    S.draft = {
      workoutId:optId, date, startedAt:Date.now(), elapsed:0, notes:'',
      entries:Object.fromEntries(o.ex.map(x=>[x.nm, Array.from({length:x.sets},()=>({w:'',r:'',done:false}))]))
    };
    save();
  } else {
    S.draft.startedAt = Date.now() - (S.draft.elapsed||0)*1000;
  }
  closeSheet();
  renderRunner();
}
function resumeDraft(){ if(S.draft){ S.draft.startedAt = Date.now() - (S.draft.elapsed||0)*1000; renderRunner(); } }

function lastPerf(nm){
  const s = [...S.sessions].sort((a,b)=>a.date<b.date?1:-1).find(x=>x.entries && x.entries[nm] && x.entries[nm].some(v=>v.done));
  if(!s) return '';
  const done = s.entries[nm].filter(v=>v.done);
  const top = done.reduce((a,b)=> (+b.w||0)>(+a.w||0)?b:a, done[0]);
  return top && +top.w>0 ? `last ${top.w}×${top.r}` : '';
}

function renderRunner(){
  const d = S.draft; if(!d) return;
  const o = getOpt(d.workoutId);
  const el = document.createElement('div');
  el.className='runner'; el.id='runner';
  el.innerHTML = `
    <div class="run-top"><div class="run-top-in">
      <button class="icon-btn" id="runMin" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg></button>
      <div class="t"><b>${esc(o.name)}</b><i>${esc(o.day.short.toUpperCase())} · ${styleName(o.style).toUpperCase()}</i></div>
      <span class="clock" id="clock">0:00</span>
      <button class="icon-btn" id="runDone" aria-label="Finish" style="border-color:var(--good);color:var(--good)">${svgCheck()}</button>
    </div></div>
    <div class="wrap" style="padding-top:14px">
      <div id="exWrap">${o.ex.map((x,i)=>runEx(x,i,d)).join('')}</div>
      <label class="fld" style="margin-top:6px"><span class="lb">Session notes</span>
        <textarea id="runNotes" placeholder="How it felt, what to change next time">${esc(d.notes||'')}</textarea></label>
    </div>
    <div class="run-foot">
      <button class="btn" id="finishBtn">Finish &amp; log session</button>
      <button class="btn danger" id="discardBtn" style="margin-top:10px">Discard — don't log this</button>
    </div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  tickClock();
  clearInterval(clockInt); clockInt = setInterval(tickClock, 1000);
}
function runEx(x,i,d){
  const sets = d.entries[x.nm] || [];
  const all = sets.length && sets.every(s=>s.done);
  const lp = lastPerf(x.nm);
  return `<div class="run-ex ${all?'complete':''}" data-ex="${esc(x.nm)}">
    <h4>${pad(i+1)}. ${esc(x.nm)}${demoLink(x.nm)}</h4>
    <div class="sub"><span>${x.sets} × ${esc(x.reps)}</span><span>rest ${esc(x.rest)}</span>${lp?`<span>${lp}</span>`:''}</div>
    ${loadHint(x.nm)}
    <div class="cue">${esc(x.cue)}</div>
    <div class="sets">${sets.map((s,j)=>`
      <div class="setrow ${s.done?'on':''}" data-set="${j}">
        <span class="sn">${j+1}</span>
        <input type="number" inputmode="decimal" placeholder="${S.units}" value="${esc(s.w)}" data-f="w" aria-label="Weight set ${j+1}">
        <input type="number" inputmode="numeric" placeholder="${(String(x.reps).match(/\d+/)||['reps'])[0]}" value="${esc(s.r)}" data-f="r" aria-label="Reps set ${j+1}">
        <button class="tick" data-tick="${j}" aria-pressed="${s.done}" aria-label="Complete set ${j+1}" data-rest="${esc(x.rest)}">${svgCheck()}</button>
      </div>`).join('')}</div>
    <button class="addset" data-add="${esc(x.nm)}">+ add set</button>
  </div>`;
}
function tickClock(){
  if(!S.draft) return;
  S.draft.elapsed = Math.floor((Date.now()-S.draft.startedAt)/1000);
  const c = $('#clock'); if(!c) return;
  const s = S.draft.elapsed, h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  c.textContent = (h?h+':'+pad(m):m) + ':' + pad(s%60);
  if(s%10===0) save();
}
function closeRunner(){
  clearInterval(clockInt); clearInterval(restInt);
  const r = $('#runner'); if(r) r.remove();
  const rt = $('#rest'); if(rt) rt.remove();
  document.body.style.overflow='';
}
function startRest(str){
  const parts = String(str).split(':').map(Number);
  let secs = parts.length===2 ? parts[0]*60+parts[1] : parts[0]||60;
  if(!secs || isNaN(secs)) return;
  clearInterval(restInt);
  let el = $('#rest');
  if(!el){ el=document.createElement('div'); el.className='resttimer'; el.id='rest'; document.body.appendChild(el); }
  const paint = ()=>{ el.innerHTML = `<span>Rest ${Math.floor(secs/60)}:${pad(secs%60)}</span><button id="skipRest">skip</button>`; };
  paint();
  restInt = setInterval(()=>{
    secs--;
    if(secs<=0){ clearInterval(restInt); el.innerHTML='<span>Rest done — next set</span>'; setTimeout(()=>el.remove(),2600);
      if(navigator.vibrate) navigator.vibrate([90,60,90]); return; }
    paint();
  },1000);
}
function finishWorkout(){
  const d = S.draft; if(!d) return;
  const o = getOpt(d.workoutId);
  const setCount = Object.values(d.entries).reduce((a,arr)=>a+arr.filter(s=>s.done).length,0);
  if(!setCount && !confirm('No sets are marked complete. Log this session anyway?')) return;
  const sess = {
    id:'s'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    date:d.date, workoutId:d.workoutId, name:o.name, notes:d.notes||'',
    durationMin:Math.max(1, Math.round((d.elapsed||0)/60)),
    entries:d.entries, setCount, volume:0
  };
  sess.volume = volumeOf(sess);
  S.sessions = S.sessions.filter(s=>s.date!==sess.date || s.workoutId!==sess.workoutId);
  S.sessions.push(sess);
  if(!S.scheduled[d.date]) S.scheduled[d.date] = {workoutId:d.workoutId, time:'', note:''};
  S.draft = null;
  saveNow();
  closeRunner(); render();
  toast(`Logged ${o.name} · ${sess.setCount} sets · ${fmtVol(sess.volume)} ${S.units}`);
}

/* ══════════════════════════════════════ events ══════════════════════════ */
document.addEventListener('click', e=>{
  const t = e.target;

  const close = t.closest('[data-close]'); if(close){ closeSheet(); return; }
  const day = t.closest('[data-day]'); if(day){ openDay(day.dataset.day); return; }
  const open = t.closest('[data-open]'); if(open){ openWorkout(open.dataset.open); return; }
  const hist = t.closest('[data-hist]'); if(hist){ openHistory(hist.dataset.hist); return; }
  const mv = t.closest('[data-mv]'); if(mv){ openMovement(mv.dataset.mv); return; }
  if(t.closest('[data-hideunfit]')){ S.hideUnfit = !S.hideUnfit; saveNow(); render(); return; }
  const bld = t.closest('[data-build]'); if(bld){ openBuilder(bld.dataset.build); return; }
  const fav = t.closest('[data-fav]');
  if(fav){
    const on = toggleFav(fav.dataset.fav);
    const o = getOpt(fav.dataset.fav);
    render();
    toast(on ? `${o?o.name:'Workout'} added to favourites` : `Removed from favourites`);
    return;
  }
  const eqBtn = t.closest('[data-equip]');
  if(eqBtn){
    const id = eqBtn.dataset.equip;
    S.equip = S.equip || EQUIP.map(x=>x.id);
    const i = S.equip.indexOf(id);
    if(i>=0){
      if(S.equip.length===1){ toast('Keep at least one equipment type on.'); return; }
      S.equip.splice(i,1);
    } else S.equip.push(id);
    saveNow();
    if($('#layer').querySelector('[data-rgo]')){ ROLL = null; openRoller(); }
    else render();
    return;
  }
  const ask = t.closest('[data-ask]');
  if(ask){ coachAsk(ask.dataset.ask); return; }
  if(t.closest('#chatSend')){
    const el = $('#chatIn'); const v = el ? el.value : '';
    if(el) el.value = '';
    coachAsk(v);
    return;
  }
  if(t.closest('[data-chatclear]')){
    if(!confirm('Clear the conversation? Saved workouts are kept.')) return;
    S.chat = []; S.plans = []; saveNow(); render(); return;
  }
  const pSave = t.closest('[data-plansave]');
  if(pSave){ const p=(S.plans||[]).find(x=>x.id===pSave.dataset.plansave); if(p) savePlan(p,false); return; }
  const pWeek = t.closest('[data-planweek]');
  if(pWeek){ const p=(S.plans||[]).find(x=>x.id===pWeek.dataset.planweek); if(p) savePlan(p,true); return; }
  const pRedo = t.closest('[data-planredo]');
  if(pRedo){
    const i = (S.plans||[]).findIndex(x=>x.id===pRedo.dataset.planredo);
    if(i<0) return;
    const old = S.plans[i];
    const fresh = buildPlan(parseRequest(old.sourceText || old.name));
    fresh.id = old.id;                       // keep the chat bubble pointing at it
    S.plans[i] = fresh; saveNow(); render(); toast('Rebuilt');
    return;
  }
  if(t.closest('[data-roll]')){ ROLL = null; openRoller(); return; }
  const rd = t.closest('[data-rday]');   if(rd){ ROLLQ.day = rd.dataset.rday; ROLL = null; openRoller(); return; }
  const rs = t.closest('[data-rstyle]'); if(rs){ ROLLQ.style = rs.dataset.rstyle; ROLL = null; openRoller(); return; }
  if(t.closest('[data-rgo]')){ ROLL = rollWorkout(ROLLQ.day, ROLLQ.style); openRoller(); return; }
  if(t.closest('[data-rsave]')){ commitRoll(false); return; }
  if(t.closest('[data-rstart]')){ commitRoll(true); return; }

  const go = t.closest('[data-goto]');
  if(go){ closeSheet(); $(`#nav button[data-tab="${go.dataset.goto}"]`).click(); return; }

  const mo = t.closest('[data-mo]');
  if(mo){ const v=+mo.dataset.mo;
    if(v===0){ calCursor=new Date(); calCursor.setDate(1); } else calCursor.setMonth(calCursor.getMonth()+v);
    render(); return; }

  const pick = t.closest('[data-pick]');
  if(pick){
    pickSel = pickSel===pick.dataset.pick ? null : pick.dataset.pick;
    [...document.querySelectorAll('[data-pick]')].forEach(p=>p.setAttribute('aria-pressed', String(p.dataset.pick===pickSel)));
    return;
  }

  const sched = t.closest('[data-schedule]');
  if(sched){
    const date = sched.dataset.schedule;
    if(!pickSel){ toast('Pick a session first.'); return; }
    S.scheduled[date] = { workoutId:pickSel, time:$('#fTime').value||'', note:$('#fNote').value.trim() };
    saveNow(); closeSheet(); render();
    toast(`${getOpt(pickSel).name} · ${relDay(date)}`);
    return;
  }
  const unsch = t.closest('[data-unschedule]');
  if(unsch){
    const d = unsch.dataset.unschedule;
    const o = S.scheduled[d] && getOpt(S.scheduled[d].workoutId);
    if(!$('#layer').innerHTML && !confirm(`Remove ${o?o.name:'this session'} from ${relDay(d)}?`)) return;
    delete S.scheduled[d]; saveNow(); closeSheet(); render(); toast('Removed from calendar');
    return;
  }

  const sp = t.closest('[data-schedpick]');
  if(sp){ const id=sp.dataset.schedpick; closeSheet(); setTimeout(()=>{ openDay(todayIso()); pickSel=id;
      [...document.querySelectorAll('[data-pick]')].forEach(p=>p.setAttribute('aria-pressed', String(p.dataset.pick===pickSel))); },10); return; }

  const st = t.closest('[data-start]');
  if(st){ startWorkout(st.dataset.start, st.dataset.date || todayIso()); return; }

  const del = t.closest('[data-delsess]');
  if(del){
    if(!confirm('Delete this logged session? This cannot be undone.')) return;
    S.sessions = S.sessions.filter(s=>s.id!==del.dataset.delsess);
    remember_deleted(del.dataset.delsess);
    saveNow(); closeSheet(); render(); toast('Session deleted');
    return;
  }

  const bs = t.closest('[data-bstyle]');
  if(bs && EDIT){
    EDIT.style = bs.dataset.bstyle;
    [...document.querySelectorAll('[data-bstyle]')].forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.bstyle===EDIT.style)));
    return;
  }
  if(t.closest('[data-badd]') && EDIT){ EDIT.ex.push(blankMove()); paintMoves(); return; }
  const brm = t.closest('[data-brm]');
  if(brm && EDIT){
    if(EDIT.ex.length<=1){ toast('A workout needs at least one movement.'); return; }
    EDIT.ex = EDIT.ex.filter(x=>String(x.k)!==brm.dataset.brm);
    paintMoves(); return;
  }
  if(t.closest('[data-bsave]') && EDIT){ saveBuilder(); return; }
  const bdel = t.closest('[data-bdel]'); if(bdel){ deleteBuilder(bdel.dataset.bdel); return; }

  const u = t.closest('[data-units]');
  if(u){ S.units=u.dataset.units; saveNow(); openSettings(); render(); return; }
  const pal = t.closest('[data-pick-palette]');
  if(pal){
    S.palette = pal.dataset.pickPalette;
    const meta = PALETTES.find(x=>x.id===S.palette);
    if(meta && meta.fx && S.fx!=='glow' && !S.fxAsked){ S.fxAsked = 1; S.fx = 'glow'; }
    applyTheme(); saveNow(); openSettings();
    return;
  }
  const fx = t.closest('[data-pick-fx]');
  if(fx){ S.fx = fx.dataset.pickFx==='glow' ? 'glow' : ''; applyTheme(); saveNow(); openSettings(); return; }
  const cor = t.closest('[data-pick-corners]');
  if(cor){ S.corners = cor.dataset.pickCorners; applyTheme(); saveNow(); openSettings(); return; }
  const th = t.closest('[data-pick-theme]');
  if(th){ S.theme=th.dataset.pickTheme; applyTheme(); saveNow(); openSettings(); return; }

  /* runner interactions */
  const tick = t.closest('[data-tick]');
  if(tick){
    const row = tick.closest('.setrow'), card = tick.closest('[data-ex]');
    const nm = card.dataset.ex, j = +tick.dataset.tick;
    const s = S.draft.entries[nm][j];
    s.done = !s.done;
    if(s.done && !s.r){ const rin = row.querySelector('[data-f="r"]'); if(rin && rin.value) s.r = rin.value; }
    tick.setAttribute('aria-pressed', String(s.done));
    row.classList.toggle('on', s.done);
    card.classList.toggle('complete', S.draft.entries[nm].every(x=>x.done));
    if(s.done) startRest(tick.dataset.rest);
    save();
    return;
  }
  const add = t.closest('[data-add]');
  if(add){
    const nm = add.dataset.add;
    S.draft.entries[nm].push({w:'',r:'',done:false});
    save();
    const card = add.closest('[data-ex]');
    const j = S.draft.entries[nm].length-1;
    const div = document.createElement('div');
    div.className='setrow'; div.dataset.set=j;
    const rest = card.querySelector('[data-rest]').dataset.rest;
    div.innerHTML = `<span class="sn">${j+1}</span>
      <input type="number" inputmode="decimal" placeholder="${S.units}" data-f="w" aria-label="Weight set ${j+1}">
      <input type="number" inputmode="numeric" placeholder="reps" data-f="r" aria-label="Reps set ${j+1}">
      <button class="tick" data-tick="${j}" aria-pressed="false" data-rest="${rest}" aria-label="Complete set ${j+1}">${svgCheck()}</button>`;
    card.querySelector('.sets').appendChild(div);
    card.classList.remove('complete');
    return;
  }
  if(t.closest('#skipRest')){ clearInterval(restInt); const r=$('#rest'); if(r) r.remove(); return; }
  if(t.closest('#finishBtn') || t.closest('#runDone')){ finishWorkout(); return; }
  if(t.closest('#runMin')){ saveNow(); closeRunner(); render(); toast('Session saved — resume it from Today'); return; }
  if(t.closest('#discardBtn')){
    if(!confirm('Discard this session? Nothing will be logged.')) return;
    S.draft=null; saveNow(); closeRunner(); render(); return;
  }
  if(t.closest('#resumeBtn')){ resumeDraft(); return; }

  if(t.closest('#acctBtn')){ openAccount(); return; }
  const au = t.closest('[data-auth]');
  if(au){
    const api = (window.SL && SL.api) || null;
    const k = au.dataset.auth;
    if(k==='mode'){ AUTHMODE = AUTHMODE==='up' ? 'in' : 'up'; ACCOUNT.error=''; openAccount(); return; }
    if(!api){ toast('Sync is not set up on this copy.'); return; }
    if(k==='google') api.google();
    if(k==='out')    api.signOut();
    if(k==='sync')   api.syncNow();
    if(k==='submit') api.email(AUTHMODE, ($('#authEmail').value||'').trim(), $('#authPass').value||'');
    if(k==='reset')  api.reset(($('#authEmail').value||'').trim());
    return;
  }

  if(t.closest('[data-openbody]')){ openBody(); return; }
  if(t.closest('[data-openprofile]')){ openProfile(); return; }

  const bwAdd = t.closest('[data-bw]');
  if(bwAdd){
    const v = parseFloat(($('#bwInput')||{}).value);
    if(!(v>0)){ toast('Enter a weight first.'); return; }
    S.weights = (S.weights||[]).filter(x=>x.date!==todayIso());
    S.weights.push({date:todayIso(), w:Math.round(v*10)/10});
    S.weights.sort((a,b)=> a.date<b.date ? -1 : 1);
    saveNow(); openBody(); render(); toast(`Logged ${Math.round(v*10)/10} ${S.units}`);
    return;
  }
  const bwDel = t.closest('[data-bwdel]');
  if(bwDel){
    if(!confirm('Delete this weight entry?')) return;
    S.weights = (S.weights||[]).filter(x=>x.date!==bwDel.dataset.bwdel);
    saveNow(); openBody(); render();
    return;
  }
  const pfl = t.closest('[data-pflevel]');
  if(pfl){ S.profile = Object.assign({}, S.profile, {level:pfl.dataset.pflevel}); saveNow(); openProfile(); return; }
  const pfs = t.closest('[data-pfsex]');
  if(pfs){ S.profile = Object.assign({}, S.profile, {sex:pfs.dataset.pfsex}); saveNow(); openProfile(); return; }
  if(t.closest('[data-pfsave]')){
    const h = parseFloat(($('#pfHeight')||{}).value), w = parseFloat(($('#pfWeight')||{}).value);
    S.profile = Object.assign({level:'new', sex:''}, S.profile,
      {height: h>0 ? h : '', weight: w>0 ? w : ''});
    if(w>0 && !(S.weights||[]).some(x=>x.date===todayIso())){
      S.weights = (S.weights||[]).concat([{date:todayIso(), w:Math.round(w*10)/10}]);
      S.weights.sort((a,b)=> a.date<b.date ? -1 : 1);
    }
    saveNow(); openProfile(); render(); toast('Profile saved');
    return;
  }

  if(t.closest('#setBtn')){ openSettings(); return; }
  if(t.closest('#themeBtn')){
    S.theme = S.theme==='dark' ? 'light' : S.theme==='light' ? 'auto' : 'dark';
    applyTheme(); saveNow();
    toast(S.theme==='auto'?'Theme: match device':S.theme==='dark'?'Theme: dark':'Theme: light');
    return;
  }
  if(t.closest('#expBtn')){ exportData(); return; }
  if(t.closest('#wipeBtn')){
    if(!confirm('Erase every logged session and planned day on this device? This cannot be undone.')) return;
    S = structuredClone(blank); saveNow(); closeSheet(); applyTheme(); render(); toast('All data erased');
    return;
  }
});

let DL;                                   // downloads capability, when the host grants one
(async ()=>{
  try{ DL = (window.claude && claude.use) ? await claude.use('downloads') : null; }
  catch(e){ DL = null; }
})();

async function exportData(){
  const json = JSON.stringify(S,null,2);
  const name = `split-ledger-${todayIso()}.json`;
  if(DL){
    try{ await DL.save({filename:name, data:json}); toast('Backup saved'); }
    catch(err){ if(!err || err.code!=='declined') toast('Could not save the backup.'); }
    return;
  }
  const blob = new Blob([json],{type:'application/json'});
  // iPhone: the share sheet is the only route to Files / AirDrop / Mail.
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Split Ledger backup'});
      toast('Backup shared');
      return;
    }
  }catch(err){ if(err && err.name==='AbortError') return; }

  if(!window.claude && 'download' in document.createElement('a')){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Backup downloaded');
    return;
  }
  try{ await navigator.clipboard.writeText(json); toast('Backup copied to the clipboard'); }
  catch(e){ toast('Saving is unavailable here — try a different browser.'); }
}
function importData(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d!=='object' || !Array.isArray(d.sessions)) throw 0;
      S = Object.assign(structuredClone(blank), d);
      saveNow(); applyTheme(); closeSheet(); render();
      toast(`Imported ${S.sessions.length} sessions`);
    }catch(err){ toast('That file is not a Split Ledger backup.'); }
  };
  fr.readAsText(file);
}

];
const LEVELS = [
  {id:'new',   name:'New to this',      f:0.65, note:'Never trained, or coming back after a long time off.'},
  {id:'some',  name:'Some experience',  f:1.00, note:'A year or so of consistent lifting.'},

function bodyWeight(){
  const w = (S.weights||[]);
  if(w.length) return +w[w.length-1].w;
  return S.profile && +S.profile.weight ? +S.profile.weight : 0;
}
function roundLoad(v){
  if(!v) return 0;
  const step = S.units==='kg' ? 2.5 : 5;
  return Math.max(step, Math.round(v/step)*step);
}

/* Best logged set wins; otherwise estimate from bodyweight. Returns null when
   the movement is not one you load. */
function suggestLoad(nm){
  const logged = movementStats().find(m => m.nm === nm && m.mode === 'load');
  if(logged && logged.last && logged.last.w > 0)
    return {w: logged.last.w, from:'log'};

  const bw = bodyWeight();
  if(!bw || !S.profile) return null;
  const hit = LOAD.find(([re]) => re.test(nm));
  if(!hit) return null;
  const [, mult, kind] = hit;
  const lvl = (LEVELS.find(l=>l.id===(S.profile.level||'new')) || LEVELS[0]).f;
  const sex = S.profile.sex === 'f' ? (kind==='bar' && /bench|press|row/i.test(nm) ? 0.62 : 0.72)
            : S.profile.sex === 'm' ? 1 : 0.85;
  return {w: roundLoad(bw * mult * lvl * sex), from:'estimate', kind};
}
function loadHint(nm){
  const r = suggestLoad(nm);
  if(!r) return '';
  const per = r.kind === 'perhand' ? ' / hand' : '';
  return `<span class="loadhint ${r.from}">${r.from==='log'?'last':'try'} ${r.w}${per} ${S.units}</span>`;
}
